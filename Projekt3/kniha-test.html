<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cesta stratéga – test</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1117">
<link rel="apple-touch-icon" href="ikona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Šach tréning">
<style>
:root{
  --papier:#f8fafc;      /* svetlé vnútorné plochy */
  --plocha:#FFFFFF;
  --les:#111827;         /* text a nadpisy */
  --les-svetly:#64748b;  /* tichý text */
  --linka:#e5e7eb;
  --cervena:#dc2626;     /* turistická značka */
  --modra:#2563eb;
  --zelena:#16a34a;
  --zlta:#f59e0b;
  --pole-svetle:#f4e7c7; /* šachovnica ako v tréningu */
  --pole-tmave:#7a9b76;
  --ok:#15803d;
  --zle:#b91c1c;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:#f4f4f6;color:var(--les);font-family:Arial,sans-serif;font-size:16px;line-height:1.5;padding:10px}
button{font:inherit;cursor:pointer}
button:focus-visible,.pole:focus-visible{outline:3px solid var(--modra);outline-offset:2px}
.obal{max-width:1180px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:12px 14px 18px;min-height:60vh}
header.hlava{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--linka)}
.hlava-prava{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;justify-content:flex-end}
.hlava-tlacidla{display:flex;gap:8px}
.hlava h1{margin:0;font-size:13px;font-weight:normal;color:var(--les-svetly)}
.hlava h2{margin:2px 0 0;font-size:22px;line-height:1.2;font-weight:bold}
.hviezdy-spolu{font-weight:700;font-size:18px;white-space:nowrap}
.hviezdy-spolu span{color:var(--zlta);-webkit-text-stroke:.6px #b45309}

/* turistická značka: biela–farba–biela */
.znacka{display:inline-flex;flex-direction:column;width:26px;height:22px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--linka);flex:none}
.znacka i{flex:1;background:#fff}
.znacka i:nth-child(2){background:var(--farba,var(--cervena))}
.trasa{display:flex;align-items:center;gap:0;margin:0 0 14px;padding:8px 10px;background:var(--papier);border-radius:10px;border:1px solid var(--linka);overflow-x:auto}
.zastavka{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 6px;border-radius:8px;color:var(--les-svetly);font-size:14px;white-space:nowrap}
.zastavka .znacka{--farba:#cbd5e1}
.zastavka.hotova .znacka{--farba:var(--cervena)}
.zastavka.aktualna{color:var(--les);font-weight:700;background:#fef3c7}
.zastavka.aktualna .znacka{--farba:var(--cervena);box-shadow:0 0 0 2px var(--cervena)}
.zastavka .h{font-size:12px;color:#b45309;letter-spacing:1px}
.chodnik{flex:1;min-width:14px;height:0;border-top:2px dashed var(--linka);margin:0 2px}

main.hra{display:grid;grid-template-columns:minmax(280px,520px) 1fr;gap:20px;align-items:start}
@media (max-width:820px){main.hra{grid-template-columns:1fr}}

/* šachovnica */
.sachovnica-obal{position:relative}
.sachovnica{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1/1;width:100%;border:6px solid #5b4636;border-radius:8px;overflow:hidden}
.pole{position:relative;border:0;padding:0;margin:0;min-width:0;min-height:0;width:100%;height:100%;overflow:hidden;font:inherit;display:flex;align-items:center;justify-content:center;background:var(--pole-svetle);user-select:none;-webkit-tap-highlight-color:transparent}
.pole.tmave{background:var(--pole-tmave)}
.pole .fig{width:86%;height:86%;object-fit:contain;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.pole .sur{position:absolute;font-size:10px;font-weight:bold;line-height:1;color:var(--les);opacity:.75;pointer-events:none}
.pole .sur.r{top:3px;left:3px}
.pole .sur.s{bottom:2px;right:4px}
.pole.vybrane{box-shadow:inset 0 0 0 4px var(--modra)}
.pole.ciel-ok{box-shadow:inset 0 0 0 5px var(--ok)}
.pole.ciel-zle{box-shadow:inset 0 0 0 5px var(--zle)}
.pole.posledny{background-image:linear-gradient(rgba(250,204,21,.5),rgba(250,204,21,.5))}
.pole.mozny::after{content:"";position:absolute;left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:rgba(0,85,164,.45);pointer-events:none}
.pole.mozny.obsadene::after{left:0;top:0;width:100%;height:100%;border-radius:0;background:radial-gradient(circle,transparent 62%,rgba(0,85,164,.5) 63%)}
.na-tahu{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--les-svetly)}
.na-tahu .bod{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1.5px var(--les)}

/* panel */
.panel{display:flex;flex-direction:column;gap:14px}
.sprievodca{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:56px;height:56px}
.bublina{position:relative;flex:1;min-width:0;background:#fffbeb;border:2px solid #fcd34d;border-radius:16px;padding:10px 14px}
.bublina::before{content:'';position:absolute;left:-11px;top:18px;border:10px solid transparent;border-right-color:#fcd34d;border-left:0}
.bublina .meno{font-weight:700;font-size:14px;color:#92400e;margin-bottom:2px}
.bublina p{margin:0}
.karta{background:var(--papier);border-radius:12px;padding:10px 12px;border:1px solid var(--linka)}
.karta h3{margin:0 0 6px;font-size:14px;font-weight:500;color:var(--les-svetly)}
.karta ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.karta li{display:flex;gap:10px;align-items:center;padding:4px 6px;border-radius:8px;font-size:14px;color:var(--les-svetly)}
.karta li .znacka{width:20px;height:17px;--farba:#cbd5e1}
.karta li b{color:var(--les);font-weight:500;min-width:62px}
.karta li.teraz{background:#fef3c7;color:var(--les)}
.karta li.teraz .znacka{--farba:var(--cervena)}
.karta li.teraz b{font-weight:700}
.spatna-vazba{background:var(--plocha);border-radius:12px;padding:12px 14px;box-shadow:0 0 0 1px var(--linka);min-height:64px}
.spatna-vazba:empty{display:none}
.spatna-vazba .riadok{margin:0 0 8px}
.spatna-vazba .riadok:last-child{margin-bottom:0}
.spatna-vazba .tah,.sprava .tah{font-weight:700}
.spatna-vazba .ok{color:var(--ok);font-weight:700}
.spatna-vazba .zle,.sprava .zle{color:var(--zle);font-weight:700}
.sprava .tah,.spatna-vazba .tah{white-space:nowrap}
.zapamataj{border-left:5px solid var(--cervena);background:var(--papier);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:8px}
.zapamataj b{display:block;margin-bottom:2px}
.cfp{font-size:14px;color:var(--les-svetly);margin:0 0 6px}
.tlacidla{display:flex;flex-wrap:wrap;gap:10px;position:sticky;bottom:0;z-index:5;padding:10px 0 14px;margin-top:-4px;background:linear-gradient(to top,#fff 78%,rgba(255,255,255,0))}
.tlacidla:not(:has(button:not([hidden]))){display:none}
.text-obal{display:flex;flex-direction:column;gap:14px}
.text-obal>*{flex-shrink:0}
.volby:empty{display:none}
.volby{display:flex;flex-wrap:wrap;gap:8px}
.volby .tl[disabled]{opacity:.45;cursor:default}
/* počítač: stránka sa neposúva, šachovnica stojí, posúva sa len text v paneli */
body.pevne main.hra{height:var(--vyska-hry);grid-template-columns:var(--sirka-dosky) 1fr}
body.pevne .panel{height:100%;min-height:0}
body.pevne .bublina p{min-height:4.5em}
body.pevne .text-obal{flex:1 1 auto;min-height:0;overflow-y:auto;padding:2px 4px 2px 2px;overscroll-behavior:contain}
body.pevne .tlacidla,body.pevne .tlacidla:not(:has(button:not([hidden]))){display:flex;position:static;background:none;padding:0;margin:0;min-height:48px}
@media (min-width:821px) and (max-height:960px){
  .karta{padding:8px 12px}
  .karta h3{margin:0 0 4px}
  .karta ol{display:flex;flex-wrap:wrap;gap:6px}
  .karta li{padding:3px 6px}
  .karta li:not(.teraz) span:last-child{display:none}
  .karta li.teraz{flex-basis:100%}
}
.tl{border:0;border-radius:10px;padding:10px 16px;background:#111827;color:#fff;font-size:15px;font-weight:bold;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tl:hover{background:#1f2937}
.tl.druhe{background:#e5e7eb;color:#111827;font-weight:normal}
.tl.male{padding:7px 12px;font-size:14px}
.tl.druhe:hover{background:#d1d5db}
.tl[hidden]{display:none}
.pomocka{background:#fef3c7;color:#92400e;border-radius:10px;padding:10px 12px}

/* úvod a koniec */
.obrazovka{padding:6px 4px 4px;max-width:760px}
.obrazovka .tl{margin:4px 8px 4px 0}
.obrazovka h2{font-size:26px;line-height:1.2;margin:0 0 12px}
.obrazovka p{max-width:62ch}
.pravidlo-karta{display:flex;gap:14px;align-items:flex-start;border-radius:12px;padding:16px;background:var(--papier);box-shadow:0 0 0 1px var(--linka);margin:16px 0}
.pravidlo-karta .znacka{width:34px;height:28px}
.vysledky{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0 16px}
.vysledky div{background:var(--papier);border-radius:10px;padding:8px 10px;font-size:14px}
.vysledky div span{display:block;color:#b45309;font-size:18px;letter-spacing:2px}

.sprava:empty,.pomocka-box:empty{display:none}
.sprava{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 0 0 1.5px var(--zle)}
.sprava.tip{box-shadow:0 0 0 1.5px var(--zlta)}
.sprava p{margin:0 0 6px}.sprava p:last-child{margin:0}
.linia{font-weight:400}
@media (max-width:820px){
  .panel .sprievodca{order:0}.panel .text-obal{order:1}.panel .tlacidla{order:4}.panel .karta{order:5}
  .karta ol{display:flex;flex-wrap:wrap;gap:6px}
  .karta li{padding:3px 6px}
  .karta li:not(.teraz) span:last-child{display:none}
  .karta li.teraz{flex-basis:100%}
}
@media (prefers-reduced-motion:no-preference){
  .pole .fig{transition:transform .12s ease}
  .pole.vybrane .fig{transform:scale(1.08)}
}

/* test: mriežka úloh a výsledok */
.trasa.mriezka{flex-wrap:wrap;gap:8px 18px;overflow-x:visible}
.skupina{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.skupina .nazov{font-size:12px;font-weight:700;color:var(--les-svetly);margin-right:4px;min-width:12px}
.bunka{width:28px;height:28px;border:0;border-radius:6px;background:#e5e7eb;color:var(--les-svetly);font-size:12px;font-weight:500;padding:0}
.bunka.ok{background:var(--ok);color:#fff}
.bunka.zle{background:var(--zle);color:#fff}
.bunka.aktualna{box-shadow:0 0 0 2px var(--les)}
.skore{font-size:20px;margin:4px 0 12px}
.skore b{font-size:40px;line-height:1}
.odznak{display:flex;gap:14px;align-items:center;border-radius:12px;padding:14px 16px;background:#fffbeb;border:2px solid #fcd34d;margin:12px 0}
.odznak .znacka{width:34px;height:28px}
.kapitoly{display:grid;gap:8px;margin:10px 0 16px}
.kap-riadok{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;background:var(--papier);border-radius:10px;padding:8px 10px;font-size:15px}
.kap-riadok .stav{font-size:13px;color:var(--ok);font-weight:500}
.kap-riadok .stav.zopakuj{color:var(--zle);font-weight:700}
.pruh{grid-column:1/-1;height:6px;border-radius:3px;background:#e5e7eb;overflow:hidden}
.pruh i{display:block;height:100%;background:var(--ok)}
.skupiny{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.skupiny div{background:var(--papier);border-radius:10px;padding:6px 10px;font-size:14px}
@media (max-width:480px){.trasa.mriezka{gap:6px 12px;padding:8px 10px}.skupina{gap:3px}.bunka{width:26px;height:26px;font-size:11px}}
</style>
</head>
<body>
<div class="obal">
  <header class="hlava">
    <div>
      <h1 id="kniha-nazov">Cesta stratéga · 1. diel</h1>
      <h2 id="nadpis">Kapitola</h2>
    </div>
    <div class="hlava-prava">
      <div class="hviezdy-spolu" aria-live="polite">Body: <b id="spolu">0</b> z <b id="max">30</b></div>
      <div class="hlava-tlacidla">
        <button class="tl druhe male" id="tl-obsah" type="button">Obsah knihy</button>
        <button class="tl druhe male" id="tl-domov" type="button">Úvod</button>
      </div>
    </div>
  </header>
  <nav class="trasa mriezka" id="trasa" aria-label="Úlohy testu"></nav>
  <div id="obsah"></div>
</div>

<template id="t-hra">
  <main class="hra">
    <div class="sachovnica-obal">
      <div class="sachovnica" id="sachovnica" role="grid" aria-label="Šachovnica"></div>
      <div class="na-tahu"><span class="bod" id="bod"></span><span id="na-tahu"></span></div>
    </div>
    <div class="panel">
      <div class="sprievodca">
        <svg class="avatar" viewBox="0 0 56 56" aria-hidden="true">
          <circle cx="28" cy="28" r="26" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
          <circle cx="28" cy="28" r="20" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
          <path d="M28 9 L33 28 L28 47 L23 28 Z" fill="#1e3a5f"/>
          <path d="M28 9 L33 28 L23 28 Z" fill="#dc2626"/>
          <circle cx="28" cy="28" r="3" fill="#fff" stroke="#1e3a5f" stroke-width="1.5"/>
        </svg>
        <div class="bublina"><div class="meno" id="meno">Kompas</div><p id="otazka"></p></div>
      </div>
      <div class="karta" aria-label="Karta piatich krokov">
        <h3>Karta piatich krokov</h3>
        <ol id="karta"></ol>
      </div>
      <div class="text-obal" id="text-obal">
        <div class="spatna-vazba" id="vazba" aria-live="polite"></div>
        <div class="sprava" id="sprava" aria-live="polite"></div>
        <div class="pomocka-box" id="pomocka-box"></div>
        <div class="volby" id="volby"></div>
      </div>
      <div class="tlacidla">
        <button class="tl druhe" id="tl-pomocka">Pomôcka</button>
        <button class="tl druhe" id="tl-riesenie" hidden>Ukáž riešenie</button>
        <button class="tl druhe" id="tl-znova" hidden>Skúsiť znova</button>
        <button class="tl" id="tl-dalej" hidden>Ďalej</button>
      </div>
    </div>
  </main>
</template>

<script>
// Spúšťa js/knihy.js: K = obsah kapitoly, ulozisko = kam sa ukladá postup,
// nav = { obsah, dalsia: {text, url} } pre tlačidlá na konci kapitoly.
window.spustiKnihu = function(K, ulozisko, nav){
'use strict';
nav = nav || {};
var KARTA = [
  ['Súper', 'Čo zmenil súperov ťah? Čo hrozí?'],
  ['Š-B-H', 'Šachy, brania, hrozby – moje aj súperove?'],
  ['Cieľ', 'Slabý pešiak, slabé pole alebo kráľ?'],
  ['Figúra', 'Ktorá figúra pôjde k cieľu a kadiaľ?'],
  ['Kontrola', 'Čo je na mojom ťahu zlé?']
];
var GLYF = {k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
var HRANICA = 24;
var KAP = ['', 'Najprv súper a bezpečnosť', 'Kto stojí lepšie', 'Slabý kráľ súpera', 'Slabý pešiak súpera', 'Slabé pole – domov pre jazdca',
  'Súperova zlá figúra', 'Vlastný voľný pešiak', 'Zlepši najhoršiu figúru', 'Veže na otvorené stĺpce a 7. rad', 'Výhodná výmena', 'Vlastné slabiny a ťah s cieľom'];
var SKUP = {A:'A – jeden ťah', B:'B – cieľ a ťah', C:'C – výber z dvoch ťahov a ťah'};

var stav = { obr:'uvod', hra:0, krok:0, ply:0, chyby:0, chybyKrok:0, pomocka:false, vyber:null, fen:'', posledny:null, zamok:false, hviezdy:{}, body:{} };
var ul = ulozisko.nacitaj(); if (ul && ul.body) stav.body = ul.body;
function uloz(){ ulozisko.uloz({body:stav.body}); }
function bodov(n){ return n===1 ? 'bod' : (n>=2 && n<=4 ? 'body' : 'bodov'); }
function predosleText(){
  var p=ulozisko.predosle(); if (!p.length) return '';
  return 'Predošlé pokusy: '+p.map(function(x){ return x.pokus+'. pokus – '+x.body+' '+bodov(x.body); }).join(', ')+'.';
}

var $ = function(id){ return document.getElementById(id); };
function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

/* ---------- FEN a šachovnica ---------- */
function rozloz(fen){
  var rows = fen.split(' ')[0].split('/'), m = {};
  for (var r=0; r<8; r++){ var f=0; for (var i=0;i<rows[r].length;i++){ var ch=rows[r][i];
    if (/\d/.test(ch)) f+=parseInt(ch,10); else { m['abcdefgh'[f]+(8-r)] = ch; f++; } } }
  return m;
}
function naTahu(fen){ return fen.split(' ')[1]; }
function hraAkt(){ return K.hry[stav.hra]; }
function krokAkt(){ return hraAkt().kroky[stav.krok]; }

function kresli(opts){
  opts = opts || {};
  var h = hraAkt(), m = rozloz(stav.fen), sach = $('sachovnica'); sach.innerHTML='';
  var biela = h.orient === 'w';
  for (var rr=0; rr<8; rr++) for (var ff=0; ff<8; ff++){
    var r = biela ? 7-rr : rr, f = biela ? ff : 7-ff;
    var sq = 'abcdefgh'[f] + (r+1);
    var b = el('button', 'pole' + (((r+f)%2===0) ? ' tmave' : ''));
    b.dataset.sq = sq; b.setAttribute('aria-label', sq + (m[sq] ? ' ' + nazovFig(m[sq]) : ''));
    if (m[sq]){ var p=m[sq], s=document.createElement('img'); s.className='fig'; s.alt=''; s.draggable=false;
      s.src='img/Pieces/'+(p===p.toUpperCase()?'w':'b')+p.toUpperCase()+'.svg'; b.appendChild(s); }
    if (ff===0) b.appendChild(el('span','sur r', String(r+1)));
    if (rr===7) b.appendChild(el('span','sur s', 'abcdefgh'[f]));
    if (stav.posledny && (stav.posledny.slice(0,2)===sq || stav.posledny.slice(2,4)===sq)) b.classList.add('posledny');
    if (stav.vyber === sq) b.classList.add('vybrane');
    if (opts.mozne && opts.mozne.indexOf(sq)>=0){ b.classList.add('mozny'); if (m[sq]) b.classList.add('obsadene'); }
    if (opts.znacky && opts.znacky[sq]) b.classList.add(opts.znacky[sq]);
    b.addEventListener('click', klik);
    sach.appendChild(b);
  }
  var t = naTahu(stav.fen);
  $('bod').style.background = t==='w' ? '#fff' : '#151a17';
  $('na-tahu').textContent = t==='w' ? 'Biely na ťahu' : 'Čierny na ťahu';
}
function nazovFig(p){ var n={k:'kráľ',q:'dáma',r:'veža',b:'strelec',n:'jazdec',p:'pešiak'}[p.toLowerCase()]; return (p===p.toUpperCase()?'biely ':'čierny ')+n; }

/* ---------- trasa a karta ---------- */
function kresliTrasu(){
  var t=$('trasa'); t.innerHTML='';
  ['A','B','C'].forEach(function(sk){
    var g=el('div','skupina'); g.appendChild(el('span','nazov', sk));
    K.hry.forEach(function(h,i){
      if (h.skupina!==sk) return;
      var b=el('button','bunka', String(i+1)); b.type='button';
      var v=stav.body[h.kolo];
      if (v===1) b.classList.add('ok'); else if (v===0) b.classList.add('zle');
      if (stav.obr==='hra' && i===stav.hra) b.classList.add('aktualna');
      b.setAttribute('aria-label','Úloha '+(i+1)+(v===1?', 1 bod':(v===0?', 0 bodov':'')));
      b.addEventListener('click', function(){ zacniHru(i); });
      g.appendChild(b);
    });
    t.appendChild(g);
  });

/* ---------- spätná väzba ---------- */
function vazba(){ return $('vazba'); }

}
function prisposob(){

window.addEventListener('resize', prisposob);
function pridaj(html, cls, kam){ if (!kam || kam===vazba()) stav.otv=null; var p=el('p','riadok'+(cls?' '+cls:'')); p.innerHTML=html; (kam||vazba()).appendChild(p); ukaz(p); return p; }
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function velke(t){ t=String(t).trim(); return t.charAt(0).toUpperCase()+t.slice(1); }
function komentar(kom, kam, uvodHtml, pripoj){
  kam = kam || vazba();
  var zap=null, cfp=null, ost=[];
  (kom||'').split('\n').forEach(function(c){
    if (/^Čo si zapamätať:/.test(c)) zap=c.replace(/^Čo si zapamätať:\s*/,'');
    else if (/^Cieľ:/.test(c)) cfp=c;
    else if (c.trim()) ost.push(c);
  });
  if (cfp && !pripoj) pridaj(esc(cfp), 'cfp', kam);
  var prvy = (uvodHtml||'') + (ost.length ? ' '+esc(ost.shift()) : '');
  if (pripoj) pripoj.innerHTML += prvy;
  else if (prvy.trim()) pridaj(prvy, null, kam);
  if (cfp && pripoj) pridaj(esc(cfp), 'cfp', kam);
  ost.forEach(function(c){ pridaj(esc(c), null, kam); });
  if (zap){ var d=el('div','zapamataj'); d.innerHTML='<b>Čo si zapamätať</b>'+esc(velke(zap)); kam.appendChild(d); ukaz(d); }
}
function tah(sk){ return '<span class="tah">'+esc(sk)+'</span>'; }
function jeCierny(sk){ return /^\d+(\.\.\.|\u2026)/.test(sk); }

function bezAno(t){ return String(t||'').replace(/^(Áno|Správne)[.!]\s*/, ''); }
// ťah súpera bez komentára sa pripojí k nasledujúcemu ťahu v tom istom odseku
var ZNAK={1:'!',2:'?',3:'!!',4:'??',5:'!?',6:'?!'};
function znak(nags){ for (var i=0;i<(nags||[]).length;i++) if (ZNAK[nags[i]]) return ZNAK[nags[i]]; return ''; }
// variant v jednom odseku: ťah, komentár, ďalšie ťahy (čierne bez čísla, ak idú hneď po bielom)
function altHtml(a){

/* text po kliknutí na nesprávne pole – podľa toho, čo na poli stojí */
var MENA={p:['pešiak','m'],n:['jazdec','m'],b:['strelec','m'],r:['veža','f'],q:['dáma','f'],k:['kráľ','m']};
function jeBiela(f){ return f===f.toUpperCase(); }
function opisFig(f){ var t=MENA[f.toLowerCase()]; return (t[1]==='f' ? (jeBiela(f)?'biela':'čierna') : (jeBiela(f)?'biely':'čierny'))+' '+t[0]; }
function opisMoja(f){ var t=MENA[f.toLowerCase()]; return (t[1]==='f'?'tvoja ':'tvoj ')+t[0]; }
function zlyKlik(sq, k){
  if (k.zle_polia && k.zle_polia[sq]) return k.zle_polia[sq];
  if (k.typ==='hrozba'){
    var mm=rozloz(stav.fen), naFig=k.polia.some(function(q){ return !!mm[q]; });
    if (naFig && !mm[sq]) return 'Pole '+sq+' je prázdne. Klikni na figúru.';
    return k.zle || 'Tam to nie je. Skús to znova.';
  }
  var m=rozloz(stav.fen), f=m[sq], ja=naTahu(stav.fen);
  var moja=function(x){ return !!x && (jeBiela(x)===(ja==='w')); };
  var mojaFarba = ja==='w' ? 'bielu' : 'čiernu';
  if (k.typ==='figura'){
    if (moja(f)) return k.zle || 'Táto figúra k cieľu nepôjde. Skús inú.';
    var jeCiel = hraAkt().kroky.some(function(x){ return x.typ==='ciel' && x.polia.indexOf(sq)>=0; });
    var co = f ? 'Na '+sq+' stojí '+opisFig(f)+(jeCiel ? ' – to je cieľ.' : ' – to je súperova figúra.') : 'Pole '+sq+' je prázdne.';
    return co+' Teraz vyber '+mojaFarba+' figúru, ktorou pôjdeš k cieľu.';
  }
  // krok Cieľ: porovnaj s tým, čo stojí na správnych poliach
  var ciele=k.polia.map(function(q){ return m[q]||'-'; });
  if (ciele.indexOf(f||'-')>=0) return k.zle || 'Skús to znova.';
  var f0=m[k.polia[0]], ciel;
  if (!f0) ciel='pole';
  else if (f0.toLowerCase()==='p') ciel='slabý '+(jeBiela(f0)?'biely':'čierny')+' pešiak';
  else ciel=opisFig(f0);
  if (moja(f)) return 'Na '+sq+' stojí '+opisMoja(f)+'. Vlastná figúra nie je cieľ, ale prostriedok. Cieľom je '+ciel+'.';
  if (f) return 'Na '+sq+' stojí '+opisFig(f)+'. Cieľom je '+ciel+'.';
  return 'Pole '+sq+' je prázdne. Cieľom je '+ciel+'.';
}

function plyAkt(){ return hraAkt().ciara[stav.ply]; }
function moznePre(sq){
  var p=plyAkt(); if (!p || !p.legal) return [];
  return p.legal.filter(function(u){ return u.slice(0,2)===sq; }).map(function(u){ return u.slice(2,4); });
}
function klikTah(sq){
  var p=plyAkt(); if (!p || !p.hrac) return;
  var m=rozloz(stav.fen), fig=m[sq], farba=naTahu(stav.fen);
  var moja = fig && ((fig===fig.toUpperCase()) === (farba==='w'));
  if (stav.vyber){
    var ciele=moznePre(stav.vyber);
    if (ciele.indexOf(sq)>=0){
      var uci=stav.vyber+sq; stav.vyber=null;
      var kand=p.legal.filter(function(u){ return u.indexOf(uci)===0; });
      uci = (kand.length>1 ? (kand.filter(function(u){ return u[4]==='q'; })[0]) : null) || kand[0];
      return vyhodnot(uci);
    }
    if (moja && sq!==stav.vyber){ stav.vyber=sq; kresli({mozne:moznePre(sq)}); return; }
    stav.vyber=null; kresli(); return;
  }
  if (moja && moznePre(sq).length){ stav.vyber=sq; kresli({mozne:moznePre(sq)}); }
}

function nastav(fen, uci){ stav.fen=fen; stav.posledny=uci; kresli(); }
function cakaj(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function prehrajLiniu(riadky, odsek){
  // varianty sa vypisujú v jednom riadku; komentár z konca varianty príde na koniec
  var pr=Promise.resolve(), koniec='', predBiely=false;
  riadky.forEach(function(r, i){
    pr = pr.then(function(){ return cakaj(800); }).then(function(){
      var sk = (i>0 && predBiely && jeCierny(r.sk)) ? bezCisla(r.sk) : r.sk; predBiely = !jeCierny(r.sk);
      nastav(r.fen, r.uci); odsek.innerHTML += ' ' + tah(sk+znak(r.nags));
      if (r.kom){ if (i===riadky.length-1) koniec = r.kom; else { odsek.innerHTML += ' ' + esc(r.kom); predBiely=false; } }
    });
  });
  return pr.then(function(){ return koniec; });
}
function hracovychTahov(){ var h=hraAkt(), n=0; for (var i=0;i<stav.ply;i++) if (h.ciara[i].hrac) n++; return n; }
function vyhodnot(uci){
  var p=plyAkt(), k=krokAkt();
  if (uci===p.uci){
    vycistiSpravu(); nastav(p.fen, uci);
    zapisTah(p, '<span class="ok">Výborne!</span> ');
    stav.ply++;
    return pokracuj();
  }
  var alt=(p.alt||[]).filter(function(a){ return a.uci===uci; })[0];
  if (alt && alt.nags.indexOf(1)>=0){
    vycistiSpravu(); stav.zamok=true; nastav(alt.fen, uci);
    var od = pridaj('<span class="ok">Výborne!</span> '+tah(alt.sk)+' '+esc(alt.kom));
    var lin = pridaj('', 'linia');
    return prehrajLiniu(alt.line, lin).then(function(kon){ if (kon) komentar(kon); koniecUlohy(true); });
  }
  if (alt && alt.nags.indexOf(5)>=0){
    stav.zamok=true; var spat=p.fen_pred, posl=stav.posledny; nastav(alt.fen, uci);
    vycistiSpravu(); sprava().classList.add('tip');
    pridaj(tah(alt.sk)+' '+esc(alt.kom), null, sprava());
    return cakaj(1600).then(function(){ stav.zamok=false; nastav(spat, posl); });
  }
  chyba(); vycistiSpravu();
  if (alt){
    stav.zamok=true; nastav(alt.fen, uci);
    pridaj('<span class="zle">Nie celkom.</span> '+tah(alt.sk)+' '+esc(alt.kom), null, sprava());
    var l2 = pridaj('', 'linia', sprava());
    return prehrajLiniu(alt.line, l2).then(function(kon){
      if (kon) pridaj(esc(kon), null, sprava());
      tlacidla({znova:true, pomocka:!stav.pomocka && !!k.pomocka, riesenie:stav.chybyKrok>=2});
    });
  }
  var spat2=p.fen_pred, posl2=stav.posledny;
  stav.zamok=true; nastav(spatFen(p.fen_pred, uci), uci);
  pridaj('<span class="zle">Nie celkom.</span> '+esc(k.zle || 'Tento ťah nevedie k cieľu. Skús to znova.'), null, sprava());
  return cakaj(1100).then(function(){ stav.zamok=false; nastav(spat2, posl2); });
}
function spatFen(fen, uci){ // len na krátke zobrazenie chybného ťahu
  var m=rozloz(fen); m[uci.slice(2,4)]=m[uci.slice(0,2)]; delete m[uci.slice(0,2)];
  var rows=[]; for (var r=8;r>=1;r--){ var s='',e=0; for (var f=0;f<8;f++){ var q='abcdefgh'[f]+r; if (m[q]){ if(e){s+=e;e=0;} s+=m[q]; } else e++; } if(e) s+=e; rows.push(s); }
  var t=fen.split(' '); t[0]=rows.join('/'); t[1]=t[1]==='w'?'b':'w'; return t.join(' ');
}
function skusZnova(){
  var p=plyAkt(); stav.zamok=false; nastav(p.fen_pred, stav.ply>0 ? hraAkt().ciara[stav.ply-1].uci : null);
  vycistiSpravu(); tlacidla({pomocka:!stav.pomocka && !!krokAkt().pomocka, riesenie:stav.chybyKrok>=2});
}
function ukazRiesenie(){
  var k=krokAkt();
  if (k.typ==='volba') return volbaKlik(k.spravna);
  if (k.typ==='ciel' || k.typ==='figura' || k.typ==='hrozba'){
    var zn={}; k.polia.forEach(function(q){ zn[q]='ciel-ok'; }); kresli({znacky:zn});
    vycistiSpravu(); pridaj(esc(bezAno(k.spravne))); stav.zamok=true; tlacidla({dalej:true}); return;
  }
  stav.zamok=false; var p=plyAkt(); nastav(p.fen_pred, stav.ply>0 ? hraAkt().ciara[stav.ply-1].uci : null); vyhodnot(p.uci);
}
function pokracuj(){
  var h=hraAkt(), k=krokAkt();
  stav.zamok=true; tlacidla({});
  var hotovo = hracovychTahov() >= k.pocet;
  function dalsi(){
    var p=h.ciara[stav.ply];
    if (!p) return Promise.resolve('koniec');
    if (p.hrac && !hotovo) return Promise.resolve('hrac');
    return cakaj(900).then(function(){
      nastav(p.fen, p.uci); zapisTah(p);
      if (!p.hrac) zapisAlt(p);
      stav.ply++; return dalsi();
    });
  }
  return dalsi().then(function(v){
    if (v==='hrac'){ stav.zamok=false; tlacidla({pomocka:!stav.pomocka && !!k.pomocka}); }
    else koniecUlohy(false);
  });
}
function koniecUlohy(cezAlt){
  var h=hraAkt();
  if (cezAlt){ var fin=h.ciara[h.ciara.length-1].kom; var m=(fin||'').match(/Čo si zapamätať:.*$/m); if (m) komentar(m[0]); }
  if (h.zaver) komentar(h.zaver);
  var bod = stav.chyby===0 ? 1 : 0, prve = !(h.kolo in stav.body);
  if (prve){ stav.body[h.kolo]=bod; ulozisko.uloz({body:stav.body}, {kolo:h.kolo, bod:bod}); }
  kresliTrasu(); stav.zamok=true; vycistiSpravu();
  if (prve) pridaj(bod ? '<span class="ok">Bod za úlohu: 1.</span> Vyriešené bez chyby.'
                       : '<span class="zle">Bod za úlohu: 0.</span> Úloha nebola vyriešená bez chyby.');
  else pridaj('Túto úlohu si už riešil. Počíta sa prvá odpoveď: '+(stav.body[h.kolo]===1?'1 bod.':'0 bodov.'));
  $('otazka').textContent = (prve && bod) ? 'Výborne, bez chyby! Prečítaj si vysvetlenie a pokračuj.' : 'Úloha je vyriešená. Prečítaj si vysvetlenie a pokračuj.';
  tlacidla({dalej:true, dalejText: dalsiaNeriesena(stav.hra)>=0 ? 'Ďalšia úloha' : 'Výsledok testu'}); ukaz();
  stav.krok = h.kroky.length;
}
function dalej(){
  var h=hraAkt();
  if (stav.krok >= h.kroky.length){
    var d=dalsiaNeriesena(stav.hra); if (d>=0) return zacniHru(d);
    return koniecTestu();
  }
  var k=krokAkt();
  if (k.typ==='ukazka'){
    var p=h.ciara[stav.ply];
    if (!p) return koniecUlohy(false);
    nastav(p.fen, p.uci); zapisTah(p); zapisAlt(p); stav.ply++;
    if (!h.ciara[stav.ply]) koniecUlohy(false);
    return;
  }
  stav.zamok=false; stav.krok++;
  if (stav.krok >= h.kroky.length) return koniecUlohy(false);
  zacniKrok();
}

function uvod(){
  stav.obr='uvod'; kresliTrasu();
  var o=$('obsah'); o.innerHTML='';
  var d=el('section','obrazovka');
  d.appendChild(el('h2', null, K.nazov));
  d.appendChild(el('p', null, K.uvod));
  if (ulozisko.pokus()>1) d.appendChild(el('p', null, 'Toto je tvoj '+ulozisko.pokus()+'. pokus. '+predosleText()));
  d.appendChild(el('p', null, 'Úlohy sú v troch skupinách po desať: A – jeden ťah, B – najprv nájdi cieľ, potom zahraj ťah, C – vyber lepší z dvoch ťahov a pokračuj. Pomôcky v teste nie sú.'));
  d.appendChild(el('p', null, 'Bod získaš, keď úlohu vyriešiš bez chyby. Po chybe uvidíš, prečo ťah nefunguje, a úlohu môžeš dokončiť, ale bod už nezískaš.'));
  var n=odpovedane();
  if (n===0){
    var b=el('button','tl','Začať test'); b.addEventListener('click', function(){ zacniHru(0); }); d.appendChild(b);
  } else if (n<K.hry.length){
    d.appendChild(el('p', null, 'Máš za sebou '+n+' z '+K.hry.length+' úloh a '+skore()+' bodov.'));
    var b2=el('button','tl','Pokračovať v teste'); b2.addEventListener('click', function(){ zacniHru(dalsiaNeriesena(-1)); }); d.appendChild(b2);
  } else {
    var b3=el('button','tl','Výsledok testu'); b3.addEventListener('click', koniecTestu); d.appendChild(b3);
  }
  o.appendChild(d);
}
function koniecTestu(){
  stav.obr='koniec'; kresliTrasu();
  var o=$('obsah'); o.innerHTML='';
  var d=el('section','obrazovka'), s=skore(), n=odpovedane(), N=K.hry.length, ok=s>=HRANICA;
  d.appendChild(el('h2', null, ok ? 'Test si zložil!' : 'Test zatiaľ nie je zložený'));
  var sk=el('p','skore'); sk.innerHTML='<b>'+s+'</b> z '+N+' bodov'; d.appendChild(sk);
  if (ulozisko.pokus()>1) d.appendChild(el('p', null, 'Pokus č. '+ulozisko.pokus()+'. '+predosleText()));
  var uzMa = ulozisko.predosle().some(function(x){ return x.body>=HRANICA; });
  if (ok){
    var od=el('div','odznak'); var zn=el('span','znacka'); zn.innerHTML='<i></i><i></i><i></i>'; od.appendChild(zn);
    var tx=el('div'); tx.appendChild(el('b', null, 'Odznak Stratég 1')); var pp=el('p', null, 'Zvládol si prvé mikroplány. Môžeš pokračovať do 2. dielu.'); pp.style.margin='2px 0 0'; tx.appendChild(pp);
    od.appendChild(tx); d.appendChild(od);
  } else if (uzMa){
    var od2=el('div','odznak'); var zn2=el('span','znacka'); zn2.innerHTML='<i></i><i></i><i></i>'; od2.appendChild(zn2);
    var tx2=el('div'); tx2.appendChild(el('b', null, 'Odznak Stratég 1')); var pp2=el('p', null, 'Ten už máš z predošlého pokusu.'); pp2.style.margin='2px 0 0'; tx2.appendChild(pp2);
    od2.appendChild(tx2); d.appendChild(od2);
  } else {
    d.appendChild(el('p', null, 'Na úspech potrebuješ '+HRANICA+' bodov. Chýba ti ešte '+(HRANICA-s)+'. Zopakuj kapitoly, ktoré sú nižšie označené, a skús test znova.'));
  }
  if (n<N) d.appendChild(el('p', null, 'Neodpovedal si ešte na '+(N-n)+' '+(N-n===1?'úlohu':(N-n<5?'úlohy':'úloh'))+'.'));
  // skupiny
  var sg=el('div','skupiny');
  ['A','B','C'].forEach(function(g){ var x=0,y=0; K.hry.forEach(function(h){ if (h.skupina===g){ y++; if (stav.body[h.kolo]===1) x++; } }); sg.appendChild(el('div', null, 'Skupina '+g+': '+x+' z '+y)); });
  d.appendChild(sg);
  // kapitoly
  d.appendChild(el('h3', null, 'Výsledok po kapitolách'));
  var tot={}, dob={};
  K.hry.forEach(function(h){ (h.princip||'').split(',').forEach(function(p){ p=p.trim(); if (!p) return; tot[p]=(tot[p]||0)+1; if (stav.body[h.kolo]===1) dob[p]=(dob[p]||0)+1; }); });
  var kap=el('div','kapitoly'), zop=[];
  for (var p=1;p<KAP.length;p++){
    var t=tot[p]||0; if (!t) continue; var x=dob[p]||0;
    var r=el('div','kap-riadok');
    r.appendChild(el('span', null, p+'. '+KAP[p]));
    r.appendChild(el('span', null, x+' z '+t));
    var stv=el('span','stav'+(x<t?' zopakuj':''), x<t ? 'zopakuj' : 'v poriadku'); stv.style.gridColumn='1/-1'; r.appendChild(stv);
    var pr=el('div','pruh'); var ii=el('i'); ii.style.width=Math.round(100*x/t)+'%'; pr.appendChild(ii); r.appendChild(pr);
    kap.appendChild(r);
    if (x<t) zop.push({p:p, podiel:x/t});
  }
  d.appendChild(kap);
  if (zop.length){
    zop.sort(function(a,b){ return a.podiel-b.podiel; });
    d.appendChild(el('p', null, 'Odporúčame zopakovať: '+zop.map(function(z){ return 'kapitolu '+z.p+' ('+KAP[z.p]+')'; }).join(', ')+'.'));
  }
  if (n<N){ var bc=el('button','tl','Pokračovať v teste'); bc.addEventListener('click', function(){ zacniHru(dalsiaNeriesena(-1)); }); d.appendChild(bc); }
  var b1=el('button','tl druhe','Prezrieť úlohy'); b1.addEventListener('click', function(){ zacniHru(0); }); d.appendChild(b1);
  var b2=el('button','tl druhe','Začať test odznova');
  b2.addEventListener('click', function(){
    if (b2.dataset.potvrd!=='1'){ b2.dataset.potvrd='1'; b2.textContent='Naozaj? Začne sa nový pokus od 1. úlohy – klikni znova'; return; }
    stav.body={}; ulozisko.novyPokus(); uvod();
  });
  d.appendChild(b2);
  o.appendChild(d);
  window.scrollTo({top:0});
}
$('nadpis').textContent = K.nazov;
document.title = 'Cesta stratéga – ' + K.nazov;
uvod();
};
