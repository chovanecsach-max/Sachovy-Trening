<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Šachový tréning — Prihlásenie</title>
<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f4f4f6;
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: min(460px, 92vw);
  background: white;
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

h1 {
  margin: 0 0 6px 0;
  font-size: 28px;
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #475569;
  margin: 0 0 24px 0;
  font-size: 14px;
}

/* Záložky */
.tabs {
  display: flex;
  border-bottom: 2px solid #e5e7eb;
  margin-bottom: 24px;
}

.tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  cursor: pointer;
  font-size: 15px;
  color: #64748b;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.15s;
}

.tab.active {
  color: #111827;
  font-weight: bold;
  border-bottom-color: #111827;
}

.form { display: none; }
.form.active { display: block; }

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 12px;
  color: #64748b;
  text-transform: uppercase;
  margin-bottom: 5px;
  font-weight: bold;
}

.field input, .field select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 14px;
  background: white;
}

.field input:focus, .field select:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
  margin-top: 6px;
}

.btn-primary { background: #111827; color: white; }
.btn-primary:hover { background: #1f2937; }

.status {
  margin-top: 14px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 13px;
  display: none;
}

.status.error { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; display: block; }
.status.success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; display: block; }
.status.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; display: block; }

.divider {
  text-align: center;
  color: #94a3b8;
  font-size: 12px;
  margin: 16px 0;
}

/* Skrytý element */
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <h1>♟ Šachový tréning</h1>
  <p class="subtitle">Prihláste sa alebo sa zaregistrujte</p>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">Prihlásenie</div>
    <div class="tab" onclick="switchTab('register')">Registrácia</div>
  </div>

  <!-- Prihlásenie -->
  <div id="loginForm" class="form active">
    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="vas@email.com">
    </div>
    <div class="field">
      <label>Heslo</label>
      <input id="loginPassword" type="password" placeholder="Vaše heslo">
    </div>
    <button class="btn-primary" onclick="login()">Prihlásiť sa</button>
    <div id="loginStatus" class="status"></div>
  </div>

  <!-- Registrácia -->
  <div id="registerForm" class="form">
    <button onclick="location.href='index.html'" style="width:100%;padding:8px;margin-bottom:14px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:13px;color:#475569;">← Späť do menu</button>
    <div class="row">
      <div class="field">
        <label>Meno *</label>
        <input id="regName" type="text" placeholder="Meno">
      </div>
      <div class="field">
        <label>Priezvisko *</label>
        <input id="regSurname" type="text" placeholder="Priezvisko">
      </div>
    </div>
    <div class="field">
      <label>Prezývka (nick) *</label>
      <input id="regNick" type="text" placeholder="napr. KingBishop99">
    </div>
    <div class="field">
      <label>Email *</label>
      <input id="regEmail" type="email" placeholder="vas@email.com">
    </div>
    <div class="field">
      <label>Heslo * (min. 6 znakov)</label>
      <input id="regPassword" type="password" placeholder="Vaše heslo">
    </div>
    <!-- Rola je vždy hráč — tréner/admin sa nastaví cez admin panel -->
    <div class="field">
      <label>Tréner</label>
      <select id="regTrener">
        <option value="">— bez trénera —</option>
      </select>
    </div>
    <div class="field">
      <label>Vstupné ELO (nepovinné)</label>
      <input id="regElo" type="number" min="1000" max="3000" placeholder="napr. 1200 (1000–3000) — ak nevyplníš, nastaví sa 1000">
    </div>
    <button class="btn-primary" onclick="register()">Zaregistrovať sa</button>
    <div id="registerStatus" class="status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://wdjsilryllqksdtmaehy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_45gFQhgPScrDjDCVC0B4Iw_q6uZKf9m";

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const SUPABASE_KEY = SUPABASE_ANON_KEY;

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
  });
  document.getElementById('loginForm').classList.toggle('active', tab === 'login');
  document.getElementById('registerForm').classList.toggle('active', tab === 'register');

  // Načítaj trénerov keď sa otvorí záložka registrácie
  if (tab === 'register') {
    loadTrainerDropdown();
  }
}

function setStatus(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'status ' + type;
}

// Načítanie trénerov do dropdown
async function loadTrainerDropdown() {
  const sel = document.getElementById('regTrener');
  // Ak sú options už načítané (okrem prvého "bez trénera"), nekresliť znova
  if (sel.options.length > 1) return;

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/profiles?role=eq.trener&select=id,name,surname,nick_name&order=surname.asc`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      }
    );
    if (!res.ok) return;
    const trainers = await res.json();
    trainers.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      const displayName = t.nick_name || `${t.name || ''} ${t.surname || ''}`.trim();
      opt.textContent = displayName;
      sel.appendChild(opt);
    });
  } catch (e) {
    console.error('Chyba načítania trénerov:', e);
  }
}

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!email || !password) {
    setStatus('loginStatus', 'Vyplň email a heslo.', 'error');
    return;
  }

  setStatus('loginStatus', 'Prihlasovanie...', 'info');

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    setStatus('loginStatus', 'Chyba: ' + error.message, 'error');
    return;
  }

  // Načítaj profil
  const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();

  if (!profile) {
    setStatus('loginStatus', 'Profil nenájdený.', 'error');
    return;
  }

  // Ulož do sessionStorage
  sessionStorage.setItem('user_id', data.user.id);
  sessionStorage.setItem('user_email', data.user.email);
  sessionStorage.setItem('user_role', profile.role);
  sessionStorage.setItem('user_nick', profile.nick_name || '');
  sessionStorage.setItem('user_name', profile.name || '');
  sessionStorage.setItem('user_surname', profile.surname || '');

  setStatus('loginStatus', 'Prihlásenie úspešné! Presmerovanie...', 'success');

  setTimeout(() => {
    location.href = 'index.html';
  }, 800);
}

async function register() {
  const name = document.getElementById('regName').value.trim();
  const surname = document.getElementById('regSurname').value.trim();
  const nick = document.getElementById('regNick').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const role = 'hrac'; // Rola je vždy hráč — tréner/admin sa nastaví cez admin panel
  const trenerIdRaw = document.getElementById('regTrener').value;
  const trenerId = trenerIdRaw || null;
  const eloInput = parseInt(document.getElementById('regElo').value);
  const baseElo = (!isNaN(eloInput) && eloInput >= 1000 && eloInput <= 3000) ? eloInput : 1000;

  if (!name || !surname || !nick || !email || !password) {
    setStatus('registerStatus', 'Vyplň všetky povinné polia.', 'error');
    return;
  }

  if (password.length < 6) {
    setStatus('registerStatus', 'Heslo musí mať aspoň 6 znakov.', 'error');
    return;
  }

  setStatus('registerStatus', 'Registrácia...', 'info');

  const { data, error } = await sb.auth.signUp({
    email,
    password,
    options: {
      emailRedirectTo: window.location.origin + window.location.pathname.replace('login.html', '') + 'verify.html',
      data: {
        name, surname, nick_name: nick, role,
        base_elo: baseElo,
        trener_id: trenerId || null
      }
    }
  });

  if (error) {
    setStatus('registerStatus', 'Chyba: ' + error.message, 'error');
    return;
  }

  // Profil a player sa vytvoria po potvrdení emailu v verify.html
  setStatus('registerStatus', '📧 Registrácia úspešná! Skontroluj email a klikni na potvrdzovací odkaz. (Skontroluj aj Spam)', 'success');
}

// Ak prídeš z menu na registráciu, nekontrolujem session
if (window.location.hash === '#register') {
  switchTab('register');
} else {
  // Skontroluj či je už prihlásený
  (async () => {
    const { data } = await sb.auth.getSession();
    if (!data.session) return; // nie je prihlásený — zostaň na login

    // Over že profil existuje — zabrání redirect slučke
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/profiles?id=eq.${data.session.user.id}&limit=1`,
        { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${data.session.access_token}` } }
      );
      const profiles = await res.json();
      if (profiles && profiles.length) {
        location.href = 'index.html';
      }
      // Ak profil neexistuje — zostaň na login (nezačne slučka)
    } catch(e) {
      // Sieťová chyba — zostaň na login
      console.error('Chyba overenia profilu:', e);
    }
  })();
}
</script>
</body>
</html>
