<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slabinová mapa</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f6;
  margin: 0;
  padding: 12px;
  color: #111827;
}
.app {
  max-width: 1100px;
  margin: 0 auto;
  background: white;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  padding: 20px;
}
h1 { margin: 0 0 6px 0; text-align: center; font-size: 26px; }
.subtitle { text-align: center; color: #475569; margin: 0 0 20px 0; }

.role-banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; text-align: center; }
.role-banner.trener        { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
.role-banner.hlavny_trener { background: #faf5ff; border: 1px solid #d8b4fe; color: #6b21a8; }
.role-banner.admin         { background: #fff7ed; border: 1px solid #fdba74; color: #c2410c; }

.filter-card { border: 1px solid #d1d5db; border-radius: 12px; padding: 14px; margin-bottom: 16px; background: #f8fafc; }
.filter-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.filter-field { display: flex; flex-direction: column; gap: 4px; }
.filter-field label { font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: bold; }

select {
  padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px;
  font-size: 14px; background: white; min-width: 220px;
}
button { padding: 10px 16px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; }
.secondary { background: #e5e7eb; color: #111827; }

.status { margin: 12px 0; padding: 10px; border-radius: 10px; border: 1px solid #d1d5db; background: #f8fafc; color: #334155; font-size: 14px; }
.status.error { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }

/* ── Záver: na čo zamerať tréning ── */
.focus-line {
  margin: 4px 0 14px; padding: 12px 14px; border-radius: 10px;
  background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a5f;
  font-size: 14px; display: none;
}
.focus-line strong { color: #1d4ed8; }

/* ── Prepínač farebnej škály ── */
.view-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 4px; }
.view-row .view-label { font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: bold; }
.view-toggle { display: inline-flex; gap: 5px; }
.view-toggle button {
  padding: 7px 14px; border: 1px solid #cbd5e1; border-radius: 18px;
  background: white; color: #475569; font-size: 13px; font-weight: bold; transition: all .15s;
}
.view-toggle button:hover { border-color: #1e3a5f; color: #1e3a5f; }
.view-toggle button.active { background: #1e3a5f; color: white; border-color: #1e3a5f; }

/* ── Akčná časť: kto je pod prahom ── */
.action-card { border: 1px solid #d1d5db; border-radius: 12px; padding: 14px; margin: 14px 0 4px; background: #f8fafc; }
.action-card .filter-row { align-items: flex-end; }
.primary { background: #111827; color: white; }
input[type="number"] {
  padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px;
  font-size: 14px; background: white; width: 110px;
}
.below-result { margin-top: 12px; border-top: 1px solid #e2e8f0; padding-top: 12px; }
.below-head { font-size: 14px; font-weight: bold; color: #111827; margin-bottom: 8px; }
.below-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.below-list li {
  display: flex; align-items: center; gap: 8px; background: white;
  border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 10px; font-size: 13px;
}
.below-list .val { font-weight: bold; padding: 2px 7px; border-radius: 5px; color: #1f2937; }
.below-none { font-size: 13px; color: #166534; background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 10px 12px; }
.below-list li label { display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0; }
.below-list input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; }
.below-tools { font-size: 12px; margin-bottom: 8px; }
.below-tools a { color: #1d4ed8; cursor: pointer; text-decoration: underline; margin-right: 10px; }

/* ── Formulár zadania ── */
.assign-box { margin-top: 14px; border-top: 1px dashed #cbd5e1; padding-top: 12px; }
.assign-box .filter-row { align-items: flex-end; }
input[type="text"], input[type="date"] {
  padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: white;
}
input[type="text"] { min-width: 200px; }
.asg-status { margin-top: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13px; }
.asg-status.ok  { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
.asg-status.err { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; }

/* ── Legenda ── */
.map-legend { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 12px; color: #64748b; margin: 6px 0 10px; }
.map-legend .box { width: 13px; height: 13px; border-radius: 3px; display: inline-block; vertical-align: -2px; margin-right: 5px; }
.map-legend .untrained-box { background: rgb(246,116,103); box-shadow: inset 0 0 0 2px rgba(255,255,255,.75); }
.map-legend .scale-lbl { font-weight: bold; color: #475569; }
.map-legend .scale-mid { color: #94a3b8; }
.scale-bar {
  width: 240px; height: 13px; border-radius: 7px; display: inline-block; vertical-align: -2px;
  background: linear-gradient(to right,
    rgb(239,83,80) 0%, rgb(252,141,120) 16.67%, rgb(253,186,116) 33.33%,
    rgb(253,224,71) 50%, rgb(190,242,100) 66.67%, rgb(110,231,152) 83.33%, rgb(52,211,113) 100%);
}

/* ── Mriežka ── */
.map-wrap { overflow-x: auto; margin-top: 6px; }
table.map { border-collapse: separate; border-spacing: 3px; font-size: 12px; width: 100%; min-width: 660px; }
table.map th { padding: 4px 3px; color: #64748b; font-weight: bold; font-size: 11px; line-height: 1.2; vertical-align: bottom; text-align: center; }
table.map th.name-h { text-align: left; padding-left: 8px; }
table.map td.name { padding: 7px 8px; white-space: nowrap; color: #111827; }
table.map td.cell { text-align: center; padding: 8px 5px; border-radius: 5px; }
table.map tr.avg-row td { border-top: 2px solid #e5e7eb; }
table.map td.avg-name { padding-top: 9px; font-weight: bold; color: #111827; white-space: nowrap; }
table.map .col-sep { border-left: 2px solid #e5e7eb; }

/* ── Fáza 2: zoraďovanie + detail ── */
table.map th.sortable { cursor: pointer; user-select: none; }
table.map th.sortable:hover { color: #1e3a5f; }
table.map th.sorted { color: #1d4ed8; }
table.map td.name { cursor: pointer; }
table.map td.name:hover { text-decoration: underline; }
table.map td.name .tw { color: #94a3b8; font-size: 11px; margin-right: 2px; }
table.map td.name.open { font-weight: bold; }
tr.detail-row > td { background: #f8fafc; border-radius: 8px; padding: 12px 14px; }
.detail-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.detail-title { font-weight: bold; font-size: 13px; color: #111827; }
.detail-chart-wrap { position: relative; height: 300px; }
.detail-msg { text-align: center; color: #64748b; font-size: 13px; padding: 24px; }
.period { display: inline-flex; gap: 5px; }
.period button { padding: 5px 10px; border: 1px solid #cbd5e1; border-radius: 16px; background: white; color: #475569; font-size: 12px; font-weight: bold; }
.period button.active { background: #1e3a5f; color: white; border-color: #1e3a5f; }
</style>
</head>

<body oncontextmenu="return false;">
<div class="app">
  <h1>Slabinová mapa</h1>
  <p class="subtitle">Prehľad ELO naprieč skupinou — kde je skupina slabá a na čo zamerať tréning.</p>

  <div id="roleBanner" class="role-banner" style="display:none;"></div>

  <div class="filter-card" id="filterCard" style="display:none;">
    <div class="filter-row">
      <div class="filter-field">
        <label>Skupina (tréner)</label>
        <select id="trenerSelect">
          <option value="all">Všetci hráči</option>
        </select>
      </div>
      <button class="secondary" onclick="goPrehlad()">📋 Prehľad zadaní</button>
      <button class="secondary" onclick="goHome()">Späť do menu</button>
    </div>
  </div>

  <div id="status" class="status">Načítavam...</div>

  <div id="focusLine" class="focus-line"></div>

  <div class="action-card" id="actionCard" style="display:none;">
    <div class="filter-row">
      <div class="filter-field">
        <label>Zručnosť</label>
        <select id="thrSkill"></select>
      </div>
      <div class="filter-field">
        <label>Prah ELO</label>
        <input type="number" id="thrValue" min="800" max="2600" step="10">
      </div>
      <button class="primary" onclick="showBelow()">Kto je pod prahom</button>
    </div>
    <div id="belowResult" class="below-result" style="display:none;"></div>
  </div>

  <div class="view-row" id="setRow" style="display:none;">
    <span class="view-label">Sada</span>
    <div class="view-toggle" id="setToggle">
      <button type="button" data-set="skills" class="active">Zručnosti</button>
      <button type="button" data-set="basic">Základné kategórie</button>
    </div>
  </div>

  <div class="view-row" id="colorRow" style="display:none;">
    <span class="view-label">Farebná škála</span>
    <div class="view-toggle" id="colorToggle">
      <button type="button" data-mode="abs" class="active">Absolútne</button>
      <button type="button" data-mode="rel">V rámci skupiny</button>
    </div>
  </div>

  <div class="map-legend" id="mapLegend" style="display:none;">
    <span class="scale-lbl" id="scaleMin">1100</span>
    <span class="scale-bar"></span>
    <span class="scale-lbl" id="scaleMax">1950+</span>
    <span class="scale-mid" id="scaleNote">1350 · 1500 · 1650</span>
    <span><span class="box untrained-box"></span>zatiaľ netrénované</span>
  </div>

  <div class="map-wrap">
    <table class="map" id="mapTable" style="display:none;">
      <thead id="mapHead"></thead>
      <tbody id="mapBody"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/player.js"></script>
<script>
// ─── Kontext prihláseného používateľa ───────────────────────────────────────
const USER_ROLE        = sessionStorage.getItem('user_role') || '';
const USER_ID          = sessionStorage.getItem('user_id') || '';
const USER_NICK        = sessionStorage.getItem('user_nick') || sessionStorage.getItem('user_name') || '';
const IS_ADMIN         = USER_ROLE === 'admin';
const IS_TRENER        = USER_ROLE === 'trener';
const IS_HLAVNY_TRENER = USER_ROLE === 'hlavny_trener';
const IS_HRAC          = USER_ROLE === 'hrac';

// Prahy pre farebné pásma (ľahko upraviteľné)
// Farebná škála — plynulý prechod sýtych farieb podľa ELO.
// Rozsah 1100–2150 pokrýva aj silných hráčov (2000+). Kotviace body sú
// rovnomerné (krok 175); medzi nimi sa farba dopočíta. Ak sa rozsah zmení,
// treba upraviť aj gradient v CSS triede .scale-bar.
const SCALE = [
  { v: 1100, c: [239,  83,  80] },  // sýta červená
  { v: 1275, c: [252, 141, 120] },  // lososová
  { v: 1450, c: [253, 186, 116] },  // oranžová
  { v: 1625, c: [253, 224,  71] },  // žltá
  { v: 1800, c: [190, 242, 100] },  // limetková
  { v: 1975, c: [110, 231, 152] },  // zelená
  { v: 2150, c: [ 52, 211, 113] }   // sýta zelená
];

// 9 zručností — rovnaké poradie a názvy ako v štatistike
const SKILL_COLS = [
  { field: 'elo_checks',            label: 'Šachy',         full: 'Šachy' },
  { field: 'elo_captures',          label: 'Brania',        full: 'Brania' },
  { field: 'elo_pawn_breakthrough', label: 'Prielomy',      full: 'Pešiakové prielomy' },
  { field: 'elo_direct_attack',     label: 'Br. so ziskom', full: 'Brania so ziskom' },
  { field: 'elo_underdefended',     label: 'Slabo pokryté', full: 'Slabo pokryté' },
  { field: 'elo_pin',               label: 'Abs. väzby',    full: 'Absolútne väzby' },
  { field: 'elo_relative_pin',      label: 'Rel. väzby',    full: 'Relatívne väzby' },
  { field: 'elo_fork',              label: 'Vidličky',      full: 'Vidličky' },
  { field: 'elo_direct_threat',     label: 'Hrozby',        full: 'Priame hrozby' },
];

// Základné kategórie (klasický tréning). Mix je len informačný — nedá sa
// cielene trénovať, takže nevstupuje do priemeru, poradia slabín ani zadaní.
const BASIC_COLS = [
  { field: 'elo_taktika',   label: 'Taktika',   full: 'Taktika' },
  { field: 'elo_strategia', label: 'Stratégia', full: 'Stratégia' },
  { field: 'elo_koncovka',  label: 'Koncovka',  full: 'Koncovka' },
  { field: 'elo',           label: 'Mix',       full: 'Mix — len informačne', info: true }
];

const BASIC_CATS = [
  { key: 'taktika',   label: 'Taktika',   color: '#ef4444' },
  { key: 'strategia', label: 'Stratégia', color: '#3b82f6' },
  { key: 'koncovka',  label: 'Koncovka',  color: '#10b981' },
  { key: 'mix',       label: 'Mix',       color: '#a855f7' }
];

// Aktívna sada: 'skills' = 9 zručností, 'basic' = základné kategórie
let colSet = 'skills';
function activeCols()    { return colSet === 'basic' ? BASIC_COLS : SKILL_COLS; }
function activeCats()    { return colSet === 'basic' ? BASIC_CATS : SKILL_CATS; }
function targetCols()    { return activeCols().filter(c => !c.info); }   // bez Mixu
function activeDefault() { return colSet === 'basic' ? 1000 : 1200; }    // východiskové ELO

// Kategórie v elo_history (activeEloCategory v skills.html) + farby čiar
const SKILL_CATS = [
  { key: 'checks',            label: 'Šachy',           color: '#ef4444' },
  { key: 'captures',          label: 'Brania',          color: '#f59e0b' },
  { key: 'pawn_breakthrough', label: 'Prielomy',        color: '#84cc16' },
  { key: 'direct_attack',     label: 'Brania so ziskom',color: '#10b981' },
  { key: 'underdefended',     label: 'Slabo pokryté',   color: '#06b6d4' },
  { key: 'pin',               label: 'Abs. väzby',      color: '#3b82f6' },
  { key: 'relative_pin',      label: 'Rel. väzby',      color: '#6366f1' },
  { key: 'fork',              label: 'Vidličky',        color: '#a855f7' },
  { key: 'direct_threat',     label: 'Hrozby',          color: '#ec4899' }
];

// Stav mapy (zoraďovanie + rozbalený detail)
let mapPlayers = [];
let mapColAvg  = [];
let sortField  = null;    // 'name' | elo_<zručnosť> | 'avg'
let sortDir    = 'asc';
let openPlayerId    = null;
let detailDays      = 90;
let detailChartInst = null;

// Farebná škála: 'abs' = absolútne ELO, 'rel' = v rámci skupiny
let colorMode = 'abs';
let relMin = null, relMax = null;

// ─── Stránkované načítanie (Supabase vracia max. 1000 riadkov) ──────────────
async function sbFetchAll(query) {
  const PAGE = 1000;
  let all = [], offset = 0;
  while (true) {
    const sep = query.includes('?') ? '&' : '?';
    const batch = await sbFetch(`${query}${sep}limit=${PAGE}&offset=${offset}`);
    if (!batch || !batch.length) break;
    all = all.concat(batch);
    if (batch.length < PAGE) break;
    offset += PAGE;
  }
  return all;
}

function setStatus(text, type = '') {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status' + (type ? ' ' + type : '');
}

function goHome() { location.href = 'index.html'; }
function goPrehlad() { location.href = 'zadania-prehlad.html'; }

// ─── Len skutoční hráči ──────────────────────────────────────────────────────
// Mapa hodnotí zverencov, takže záznamy trénerov/adminov sa vynechávajú —
// inak by ich (spravidla netrénované, 1200) hodnoty skresľovali priemer skupiny.
// Hráč bez naviazaného profilu (založený ručne, bez konta) sa ponecháva.
const STAFF_ROLES = ['trener', 'hlavny_trener', 'admin'];
function onlyPlayers(rows) {
  return (rows || []).filter(p => !STAFF_ROLES.includes(p.profile?.role));
}

// ─── Farebné pásmo bunky ─────────────────────────────────────────────────────
function tier(v) {
  const s = SCALE;
  let c;
  if (v <= s[0].v) c = s[0].c;
  else if (v >= s[s.length - 1].v) c = s[s.length - 1].c;
  else {
    for (let i = 0; i < s.length - 1; i++) {
      if (v >= s[i].v && v <= s[i + 1].v) {
        const t = (v - s[i].v) / (s[i + 1].v - s[i].v);
        c = s[i].c.map((ch, j) => Math.round(ch + t * (s[i + 1].c[j] - ch)));
        break;
      }
    }
  }
  return { bg: `rgb(${c[0]},${c[1]},${c[2]})`, fg: '#1f2937' };
}
function cellColor(v) {
  // V relatívnom režime sa najslabšia hodnota v skupine natiahne na začiatok
  // škály a najsilnejšia na koniec — rozdiely vnútri skupiny sú tak maximálne
  // viditeľné. Ak sú všetky hodnoty rovnaké, ostáva absolútne farbenie.
  if (colorMode === 'rel' && relMin !== null && relMax > relMin) {
    const t = (v - relMin) / (relMax - relMin);
    return tier(SCALE[0].v + t * (SCALE[SCALE.length - 1].v - SCALE[0].v));
  }
  return tier(v);
}

function computeRelRange(players) {
  const all = [];
  players.forEach(p => displayValues(p).forEach(v => all.push(v)));
  relMin = all.length ? Math.min(...all) : null;
  relMax = all.length ? Math.max(...all) : null;
}

function renderLegend() {
  const minEl = document.getElementById('scaleMin');
  const maxEl = document.getElementById('scaleMax');
  const note  = document.getElementById('scaleNote');
  if (colorMode === 'rel' && relMin !== null && relMax > relMin) {
    minEl.textContent = Math.round(relMin);
    maxEl.textContent = Math.round(relMax);
    note.textContent  = 'najslabšia → najsilnejšia hodnota v skupine';
  } else {
    minEl.textContent = String(SCALE[0].v);
    maxEl.textContent = SCALE[SCALE.length - 1].v + '+';
    note.textContent  = (colorMode === 'rel')
      ? 'všetky hodnoty rovnaké — zobrazujem absolútne'
      : [SCALE[2].v, SCALE[3].v, SCALE[4].v].join(' · ');
  }
}

function cellHtml(v, opts = {}) {
  const t = cellColor(v);
  const untrained = (v === activeDefault());
  const border = untrained ? 'box-shadow:inset 0 0 0 2px rgba(255,255,255,.75);' : '';
  const title  = untrained ? ' title="Zatiaľ netrénované (východisková hodnota 1200)"' : '';
  const weight = opts.bold ? 700 : 600;
  const sep    = opts.sep ? ' col-sep' : '';
  return `<td class="cell${sep}" style="background:${t.bg};color:${t.fg};font-weight:${weight};${border}"${title}>${Math.round(v)}</td>`;
}

// ─── Načítanie hráčov skupiny ────────────────────────────────────────────────
async function fetchMapPlayers(trenerFilter) {
  const allFields = [...new Set([...SKILL_COLS, ...BASIC_COLS].map(c => c.field))].join(',');
  const cols = `id,name,surname,trener_id,${allFields},profile:profiles!user_id(role)`;
  let rows;
  if (IS_TRENER) {
    rows = await sbFetchAll(`players?trener_id=eq.${USER_ID}&select=${cols}&order=surname.asc,name.asc`);
  } else if (trenerFilter && trenerFilter !== 'all') {
    rows = await sbFetchAll(`players?trener_id=eq.${trenerFilter}&select=${cols}&order=surname.asc,name.asc`);
  } else {
    rows = await sbFetchAll(`players?select=${cols}&order=surname.asc,name.asc`);
  }
  return onlyPlayers(rows);
}

async function fetchTrenerList() {
  try {
    const trainers = await sbFetch('profiles?role=eq.trener&select=id,name,surname,nick_name&order=surname.asc');
    return trainers || [];
  } catch(e) { return []; }
}

// ─── Vykreslenie mapy ────────────────────────────────────────────────────────
// Hodnoty všetkých zobrazených stĺpcov (vrátane informačných) — pre farby
function displayValues(p) {
  return activeCols().map(c => Number(p[c.field] ?? activeDefault()));
}
// Hodnoty, ktoré vstupujú do priemeru a poradia slabín (bez informačných)
function skillValues(p) {
  return targetCols().map(c => Number(p[c.field] ?? activeDefault()));
}
function mean(arr) {
  return arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0;
}

// ─── Akčná časť: kto je pod prahom v zručnosti X ─────────────────────────────
// Naplní výber zručností, prednastaví najslabšiu zručnosť skupiny a ako prah
// použije priemer skupiny v nej (teda "kto zaostáva za skupinou").
function initThresholdPanel(weakestIdx) {
  const sel = document.getElementById('thrSkill');
  sel.innerHTML = activeCols()
    .map((c, i) => c.info ? '' : `<option value="${i}">${c.full}</option>`).join('');
  sel.value = String(weakestIdx);
  setDefaultThreshold();
  sel.onchange = () => { setDefaultThreshold(); hideBelow(); };
  document.getElementById('actionCard').style.display = '';
  hideBelow();
}

function setDefaultThreshold() {
  const i = Number(document.getElementById('thrSkill').value || 0);
  document.getElementById('thrValue').value = Math.round(mapColAvg[i] || 1200);
}

function hideBelow() {
  const el = document.getElementById('belowResult');
  el.style.display = 'none';
  el.innerHTML = '';
}

function showBelow() {
  const i    = Number(document.getElementById('thrSkill').value || 0);
  const col  = activeCols()[i];
  const thr  = Number(document.getElementById('thrValue').value);
  const el   = document.getElementById('belowResult');

  if (!thr || isNaN(thr)) { setStatus('Zadaj platný prah ELO.', 'error'); return; }

  const below = mapPlayers
    .map(p => ({
      id:   p.id,
      name: `${p.surname || ''} ${p.name || ''}`.trim() || '(bez mena)',
      val:  Number(p[col.field] ?? activeDefault())
    }))
    .filter(x => x.val < thr)
    .sort((a, b) => a.val - b.val);

  if (!below.length) {
    el.innerHTML = `<div class="below-none">✅ V zručnosti <strong>${col.full}</strong> nie je pod prahom ${thr} nikto zo skupiny.</div>`;
    el.style.display = '';
    return;
  }

  const items = below.map(x => {
    const c = cellColor(x.val);
    return `<li><label>
      <input type="checkbox" class="pchk" value="${x.id}" data-val="${x.val}" checked>
      <span class="val" style="background:${c.bg}">${x.val}</span>${escapeHtml(x.name)}
    </label></li>`;
  }).join('');

  // Predvolený termín: o 14 dní
  const d = new Date(); d.setDate(d.getDate() + 14);
  const defDeadline = d.toISOString().substring(0, 10);

  el.innerHTML = `
    <div class="below-head">${col.full} — pod prahom ${thr}: ${below.length} z ${mapPlayers.length}</div>
    <div class="below-tools"><a onclick="checkAll(true)">Označiť všetkých</a><a onclick="checkAll(false)">Zrušiť označenie</a></div>
    <ul class="below-list">${items}</ul>
    <div class="assign-box">
      <div class="filter-row">
        <div class="filter-field">
          <label>Typ cieľa</label>
          <select id="asgType">
            <option value="elo">Dosiahnuť ELO</option>
            <option value="count">Vyriešiť počet úloh</option>
          </select>
        </div>
        <div class="filter-field">
          <label>Hodnota</label>
          <input type="number" id="asgValue" min="1" max="2600" step="10" value="${thr}">
        </div>
        <div class="filter-field">
          <label>Termín</label>
          <input type="date" id="asgDeadline" value="${defDeadline}">
        </div>
        <div class="filter-field">
          <label>Poznámka (nepovinné)</label>
          <input type="text" id="asgNote" placeholder="napr. pozri si aj teóriu">
        </div>
        <button class="primary" onclick="createAssignments()">📌 Zadať úlohu označeným</button>
      </div>
      <div id="asgStatus" class="asg-status" style="display:none;"></div>
    </div>`;
  el.style.display = '';

  // Pri prepnutí typu cieľa prednastav zmysluplnú hodnotu
  document.getElementById('asgType').onchange = function () {
    const v = document.getElementById('asgValue');
    v.value = (this.value === 'count') ? 20 : thr;
    v.step  = (this.value === 'count') ? 5 : 10;
  };
}

function checkAll(state) {
  document.querySelectorAll('.pchk').forEach(b => { b.checked = state; });
}

function setAsgStatus(text, type) {
  const el = document.getElementById('asgStatus');
  if (!el) return;
  el.textContent = text;
  el.className = 'asg-status ' + type;
  el.style.display = '';
}

// ─── Vytvorenie zadaní pre označených hráčov ────────────────────────────────
async function createAssignments() {
  const boxes = [...document.querySelectorAll('.pchk:checked')];
  if (!boxes.length) { setAsgStatus('Označ aspoň jedného hráča.', 'err'); return; }

  const i     = Number(document.getElementById('thrSkill').value || 0);
  const col   = activeCols()[i];
  const skill = col.field.replace('elo_', '');          // 'fork', 'checks', …
  const type  = document.getElementById('asgType').value;
  const value = Number(document.getElementById('asgValue').value);
  const dl    = document.getElementById('asgDeadline').value || null;
  const note  = (document.getElementById('asgNote').value || '').trim() || null;

  if (!value || value <= 0)                    { setAsgStatus('Zadaj platnú hodnotu cieľa.', 'err'); return; }
  if (type === 'elo'   && (value < 800 || value > 2600)) { setAsgStatus('ELO cieľ musí byť medzi 800 a 2600.', 'err'); return; }
  if (type === 'count' && value > 500)         { setAsgStatus('Počet úloh je príliš vysoký (max 500).', 'err'); return; }

  const rows = boxes.map(b => ({
    player_id:    Number(b.value),
    trener_id:    USER_ID,
    skill:        skill,
    target_type:  type,
    target_value: value,
    baseline_elo: Number(b.dataset.val),
    deadline:     dl,
    note:         note
  }));

  setAsgStatus('Zadávam...', 'ok');
  try {
    await sbFetch('assignments', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify(rows)
    });
    const cielText = (type === 'elo')
      ? `dosiahnuť ELO ${value}`
      : `vyriešiť ${value} úloh`;
    setAsgStatus(`✅ Zadané ${rows.length} hráčom — ${col.full}: ${cielText}${dl ? ', termín ' + dl : ''}.`, 'ok');
  } catch (e) {
    setAsgStatus('Chyba pri zadávaní: ' + e.message, 'err');
  }
}

function renderMap(players) {
  const table   = document.getElementById('mapTable');
  const legend   = document.getElementById('mapLegend');
  const focusEl  = document.getElementById('focusLine');

  if (!players || !players.length) {
    table.style.display = 'none';
    legend.style.display = 'none';
    focusEl.style.display = 'none';
    document.getElementById('colorRow').style.display = 'none';
    document.getElementById('setRow').style.display = 'none';
    document.getElementById('actionCard').style.display = 'none';
    setStatus('Táto skupina nemá žiadnych hráčov.', 'error');
    return;
  }

  mapPlayers = players;
  collapseDetail();

  // Rozsah pre relatívne farbenie + legenda podľa režimu
  computeRelRange(players);
  renderLegend();

  // Priemer stĺpca (nezávislý od zoradenia) — pre pätu aj záver
  mapColAvg = activeCols().map(c => mean(players.map(p => Number(p[c.field] ?? activeDefault()))));

  renderHead();
  renderRows();

  table.style.display = '';
  legend.style.display = 'flex';
  document.getElementById('colorRow').style.display = 'flex';
  document.getElementById('setRow').style.display = 'flex';

  // Záver: dve najslabšie zručnosti skupiny
  const ranked = activeCols()
    .map((c, i) => ({ label: c.full, avg: mapColAvg[i], idx: i, info: !!c.info }))
    .filter(r => !r.info)
    .sort((a, b2) => a.avg - b2.avg);
  const worst = ranked.slice(0, 2).map(r => `${r.label} (${Math.round(r.avg)})`).join(', ');
  focusEl.innerHTML = `🎯 <strong>Na čo zamerať tréning:</strong> ${worst} — najnižší priemer v skupine.`;
  focusEl.style.display = 'block';

  // Akčný panel — prednastavený na najslabšiu zručnosť
  initThresholdPanel(ranked[0].idx);

  const n = players.length;
  setStatus(`Skupina: ${n} ${n === 1 ? 'hráč' : (n < 5 ? 'hráči' : 'hráčov')}.`);
}

// ─── Hlavička so zoraditeľnými stĺpcami ──────────────────────────────────────
function sortTh(field, label, cls, title) {
  const active = sortField === field;
  const arrow  = active ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
  const t = title ? ` title="${title}"` : '';
  const c = 'sortable' + (cls ? ' ' + cls : '') + (active ? ' sorted' : '');
  return `<th class="${c}" data-sort="${field}"${t}>${label}${arrow}</th>`;
}
function renderHead() {
  let h = '<tr>' + sortTh('name', 'Hráč', 'name-h');
  activeCols().forEach(c => { h += sortTh(c.field, c.label, c.info ? 'col-sep' : '', c.full); });
  h += sortTh('avg', 'Priemer', 'col-sep') + '</tr>';
  document.getElementById('mapHead').innerHTML = h;
}

// ─── Riadky (zoradené) + rozbalený detail + päta ─────────────────────────────
function renderRows() {
  const rows = mapPlayers.slice();
  if (sortField) {
    const dir = sortDir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
      if (sortField === 'name') {
        const na = `${a.surname || ''} ${a.name || ''}`.trim().toLowerCase();
        const nb = `${b.surname || ''} ${b.name || ''}`.trim().toLowerCase();
        return na.localeCompare(nb, 'sk') * dir;
      }
      const va = (sortField === 'avg') ? mean(skillValues(a)) : Number(a[sortField] ?? activeDefault());
      const vb = (sortField === 'avg') ? mean(skillValues(b)) : Number(b[sortField] ?? activeDefault());
      return (va - vb) * dir;
    });
  }

  const colspan = activeCols().length + 2;
  let b = '';
  rows.forEach(p => {
    const vals = displayValues(p);
    const nm = `${p.surname || ''} ${p.name || ''}`.trim() || '(bez mena)';
    const isOpen = (p.id === openPlayerId);
    b += `<tr><td class="name${isOpen ? ' open' : ''}" onclick="toggleDetail(${JSON.stringify(p.id)})"><span class="tw">${isOpen ? '▾' : '▸'}</span>${escapeHtml(nm)}</td>`;
    vals.forEach((v, ci) => { b += cellHtml(v, { sep: !!activeCols()[ci].info }); });
    b += cellHtml(mean(skillValues(p)), { bold: true, sep: true });
    b += '</tr>';
    if (isOpen) {
      b += `<tr class="detail-row"><td colspan="${colspan}">
        <div class="detail-head">
          <span class="detail-title">Progres zručností — ${nm}</span>
          <div class="period" id="detailPeriod">
            <button data-days="30">30 dní</button>
            <button data-days="90">90 dní</button>
            <button data-days="365">Rok</button>
          </div>
        </div>
        <div class="detail-chart-wrap"><canvas id="detailChart" role="img" aria-label="Graf progresu ELO zručností hráča">Progres ELO zručností</canvas></div>
        <div id="detailMsg" class="detail-msg" style="display:none;"></div>
      </td></tr>`;
    }
  });

  // Priemer skupiny
  b += '<tr class="avg-row"><td class="avg-name">Priemer skupiny</td>';
  mapColAvg.forEach((v, ci) => { b += cellHtml(v, { bold: true, sep: !!activeCols()[ci].info }); });
  b += cellHtml(mean(mapColAvg.filter((_, ci) => !activeCols()[ci].info)), { bold: true, sep: true });
  b += '</tr>';
  document.getElementById('mapBody').innerHTML = b;

  // Handlery period tlačidiel v otvorenom detaile
  const per = document.getElementById('detailPeriod');
  if (per) {
    per.querySelectorAll('button').forEach(btn => {
      btn.classList.toggle('active', Number(btn.dataset.days) === detailDays);
      btn.addEventListener('click', () => {
        detailDays = Number(btn.dataset.days);
        per.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === btn));
        loadDetailChart(openPlayerId, detailDays);
      });
    });
  }
}

// ─── Rozbalenie / zabalenie detailu hráča ────────────────────────────────────
function collapseDetail() {
  openPlayerId = null;
  if (detailChartInst) { detailChartInst.destroy(); detailChartInst = null; }
}
function toggleDetail(pid) {
  if (openPlayerId === pid) {
    collapseDetail();
    renderRows();
    return;
  }
  collapseDetail();
  openPlayerId = pid;
  detailDays = 90;
  renderRows();
  loadDetailChart(pid, detailDays);
}

// ─── Načítanie a vykreslenie grafu zručností v detaile ───────────────────────
function showDetailMsg(t) { const m = document.getElementById('detailMsg'); if (m) { m.textContent = t; m.style.display = ''; } }
function hideDetailMsg()  { const m = document.getElementById('detailMsg'); if (m) m.style.display = 'none'; }

async function loadDetailChart(pid, days) {
  const canvas = document.getElementById('detailChart');
  if (!canvas) return;
  if (typeof Chart === 'undefined') { showDetailMsg('Načítavam graf...'); return; }
  showDetailMsg('Načítavam...');
  try {
    const start = new Date();
    start.setDate(start.getDate() - days);
    const data = await sbFetchAll(
      `elo_history?player_id=eq.${pid}&created_at=gte.${start.toISOString()}&select=category,elo_value,created_at&order=created_at.asc,id.asc`
    );
    renderSkillLineChart(data, days);
  } catch(e) {
    showDetailMsg('Chyba pri načítaní grafu: ' + e.message);
  }
}

function formatDateLabel(iso) {
  const d = new Date(iso);
  return `${d.getDate()}.${d.getMonth() + 1}.`;
}

function renderSkillLineChart(data, days) {
  const skillKeys = new Set(activeCats().map(c => c.key));
  const skillData = (data || []).filter(d => skillKeys.has(d.category));
  if (detailChartInst) { detailChartInst.destroy(); detailChartInst = null; }
  const existing = Chart.getChart('detailChart'); if (existing) existing.destroy();

  if (!skillData.length) {
    showDetailMsg('Zatiaľ žiadne dáta pre jednotlivé zručnosti v tomto období.');
    return;
  }
  hideDetailMsg();

  const allDates = [...new Set(skillData.map(d => d.created_at.substring(0, 10)))].sort();
  const labels = allDates.map(formatDateLabel);
  const datasets = activeCats().map(c => {
    const byDay = {};
    skillData.filter(d => d.category === c.key).forEach(d => { byDay[d.created_at.substring(0, 10)] = d.elo_value; });
    return {
      label: c.label,
      data: allDates.map(d => byDay[d] ?? null),
      borderColor: c.color, backgroundColor: c.color + '18',
      tension: 0.3, pointRadius: days <= 30 ? 3 : 2, pointHoverRadius: 5,
      fill: false, spanGaps: true
    };
  });

  const skip = days > 30;
  detailChartInst = new Chart(document.getElementById('detailChart').getContext('2d'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          backgroundColor: '#1e293b', titleColor: '#f1f5f9', bodyColor: '#cbd5e1', padding: 10, borderWidth: 0,
          callbacks: { title: items => allDates[items[0].dataIndex] || '', label: ct => ` ${ct.dataset.label}: ${ct.parsed.y}` }
        }
      },
      scales: {
        x: { ticks: { color: '#94a3b8', font: { size: 11 }, maxRotation: 45, autoSkip: skip, maxTicksLimit: skip ? 13 : 31 }, grid: { color: '#e2e8f0' } },
        y: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { color: '#e2e8f0' } }
      }
    }
  });
}

// ─── Načítanie a obnovenie ───────────────────────────────────────────────────
async function loadMap() {
  setStatus('Načítavam...');
  try {
    const filter = document.getElementById('trenerSelect').value;
    const players = await fetchMapPlayers(filter);
    renderMap(players);
  } catch(e) {
    setStatus('Chyba pri načítaní: ' + e.message, 'error');
  }
}

// ─── Inicializácia ───────────────────────────────────────────────────────────
async function init() {
  // Ochrana: len prihlásení; stránka je pre trénerov/adminov
  if (!requireLogin()) return;
  if (IS_HRAC) {
    alert('Slabinová mapa je dostupná len pre trénerov a administrátorov.');
    goHome();
    return;
  }

  // Role banner
  const banner = document.getElementById('roleBanner');
  if (IS_TRENER) {
    banner.textContent = `🧑‍🏫 Tréner ${USER_NICK} — moja skupina`;
    banner.className = 'role-banner trener';
  } else if (IS_HLAVNY_TRENER) {
    banner.textContent = `👑 Hlavný tréner ${USER_NICK} — všetci hráči`;
    banner.className = 'role-banner hlavny_trener';
  } else if (IS_ADMIN) {
    banner.textContent = '🔧 Admin — všetci hráči';
    banner.className = 'role-banner admin';
  }
  banner.style.display = '';

  // Prepínač sady stĺpcov: Zručnosti / Základné kategórie
  document.getElementById('setToggle').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const v = btn.dataset.set;
    if (!v || v === colSet) return;
    colSet = v;
    document.querySelectorAll('#setToggle button')
      .forEach(b => b.classList.toggle('active', b === btn));
    sortField = null;                 // poradie stĺpcov sa zmenilo
    if (mapPlayers.length) renderMap(mapPlayers);
  });

  // Prepínač farebnej škály: Absolútne / V rámci skupiny
  document.getElementById('colorToggle').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const m = btn.dataset.mode;
    if (!m || m === colorMode) return;
    colorMode = m;
    document.querySelectorAll('#colorToggle button')
      .forEach(b => b.classList.toggle('active', b === btn));
    collapseDetail();
    renderLegend();
    renderRows();
  });

  // Zoraďovanie klikom na hlavičku stĺpca (delegované — hlavička sa prekresľuje)
  document.getElementById('mapHead').addEventListener('click', e => {
    const th = e.target.closest('th.sortable');
    if (!th) return;
    const f = th.dataset.sort;
    if (sortField === f) sortDir = (sortDir === 'asc' ? 'desc' : 'asc');
    else { sortField = f; sortDir = 'asc'; }   // zručnosti/priemer: najslabší hore; meno: A→Z
    collapseDetail();
    renderHead();
    renderRows();
  });

  // Výber skupiny — len pre admina / hlavného trénera
  if (IS_ADMIN || IS_HLAVNY_TRENER) {
    document.getElementById('filterCard').style.display = '';
    const sel = document.getElementById('trenerSelect');
    const trainers = await fetchTrenerList();
    trainers.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.nick_name || `${t.surname || ''} ${t.name || ''}`.trim();
      sel.appendChild(opt);
    });
    sel.addEventListener('change', loadMap);
  } else {
    // Tréner: aj tak zobraz tlačidlo Späť do menu
    document.getElementById('filterCard').style.display = '';
    document.querySelector('#trenerSelect').closest('.filter-field').style.display = 'none';
  }

  await loadMap();
}

init();
</script>
