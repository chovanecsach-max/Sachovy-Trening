<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesačný report</title>
<style>
body { font-family: Arial, sans-serif; background: #f4f4f6; margin: 0; padding: 12px; color: #111827; }
.app { max-width: 900px; margin: 0 auto; background: white; border-radius: 14px;
       box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 22px; }
h1 { margin: 0 0 6px 0; text-align: center; font-size: 26px; }
.subtitle { text-align: center; color: #475569; margin: 0 0 18px 0; }

.filter-card { border: 1px solid #d1d5db; border-radius: 12px; padding: 14px; margin-bottom: 16px; background: #f8fafc; }
.filter-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.filter-field { display: flex; flex-direction: column; gap: 4px; }
.filter-field label { font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: bold; }
select, input[type="month"] { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px;
                              font-size: 14px; background: white; min-width: 170px; }
button { padding: 10px 16px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; }
.primary { background: #111827; color: white; font-weight: bold; }
.secondary { background: #e5e7eb; color: #111827; }

.status { margin: 12px 0; padding: 10px; border-radius: 10px; border: 1px solid #d1d5db;
          background: #f8fafc; color: #334155; font-size: 14px; }
.status.error { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }

/* ── Report ── */
.rep-head { border-bottom: 3px solid #1e3a5f; padding-bottom: 10px; margin-bottom: 16px; }
.rep-title { font-size: 21px; font-weight: bold; color: #1e3a5f; }
.rep-sub { font-size: 14px; color: #64748b; margin-top: 3px; }

.tiles { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.tile { flex: 1; min-width: 110px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; background: #fff; }
.tile .n { font-size: 21px; font-weight: bold; line-height: 1.1; color: #1e3a5f; }
.tile .l { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: bold; margin-top: 3px; }
.tile.warn .n { color: #b91c1c; }

.focus { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px;
         padding: 12px 14px; font-size: 14px; color: #1e3a5f; margin-bottom: 16px; }
.focus strong { color: #1d4ed8; }

.sec-title { font-size: 13px; text-transform: uppercase; color: #94a3b8; font-weight: bold;
             margin: 20px 0 10px; letter-spacing: .5px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }

/* ── Blok hráča (rovnaký blok sa raz použije aj pre rodičovský report) ── */
.pb { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
.pb.idle { background: #fffbfa; border-color: #fecaca; }
.pb-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.pb-name { font-size: 16px; font-weight: bold; }
.pb-tag { font-size: 11px; font-weight: bold; padding: 3px 9px; border-radius: 20px; }
.pb-tag.idle { background: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; }
.pb-tag.ok   { background: #f0fdf4; color: #166534; border: 1px solid #86efac; }
.pb-line { font-size: 13px; color: #334155; margin: 3px 0; }
.pb-line .lbl { color: #64748b; }
.up   { color: #166534; font-weight: bold; }
.down { color: #b91c1c; font-weight: bold; }
.flat { color: #94a3b8; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.chip { font-size: 12px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; padding: 2px 7px; }

.warn-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 12px 14px; font-size: 13px; color: #92400e; }
.warn-box ul { margin: 6px 0 0; padding-left: 20px; }
.links { margin-top: 18px; font-size: 13px; }
.links a { color: #1d4ed8; margin-right: 14px; }
.empty { text-align: center; color: #64748b; font-style: italic; padding: 26px; }

@media print {
  body { background: white; padding: 0; }
  .app { box-shadow: none; border-radius: 0; max-width: none; padding: 0; }
  .no-print { display: none !important; }
  .pb { break-inside: avoid; page-break-inside: avoid; }
  .sec-title { break-after: avoid; }
}
</style>
</head>

<body oncontextmenu="return false;">
<div class="app">
  <h1 class="no-print">📄 Mesačný report</h1>
  <p class="subtitle no-print">Prehľad práce skupiny za mesiac — na obrazovku, tlač alebo uloženie do PDF.</p>

  <div class="filter-card no-print">
    <div class="filter-row">
      <div class="filter-field">
        <label>Mesiac</label>
        <input type="month" id="month">
      </div>
      <div class="filter-field" id="groupField">
        <label>Skupina (tréner)</label>
        <select id="trenerSelect"><option value="all">Všetci hráči</option></select>
      </div>
      <button class="primary" onclick="build()">Zostaviť report</button>
      <button class="secondary" onclick="window.print()">🖨 Tlač / PDF</button>
      <button class="secondary" onclick="goHome()">Späť do menu</button>
    </div>
  </div>

  <div id="status" class="status no-print">Vyber mesiac a klikni na Zostaviť report.</div>
  <div id="report"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/player.js"></script>
<script>
const USER_ROLE        = sessionStorage.getItem('user_role') || '';
const USER_ID          = sessionStorage.getItem('user_id') || '';
const USER_NICK        = sessionStorage.getItem('user_nick') || sessionStorage.getItem('user_name') || '';
const IS_ADMIN         = USER_ROLE === 'admin';
const IS_TRENER        = USER_ROLE === 'trener';
const IS_HLAVNY_TRENER = USER_ROLE === 'hlavny_trener';
const IS_HRAC          = USER_ROLE === 'hrac';

// Zručnosti (default 1200) a základné kategórie (default 1000)
const SKILL_COLS = [
  { f: 'elo_checks',            k: 'checks',            n: 'Šachy' },
  { f: 'elo_captures',          k: 'captures',          n: 'Brania' },
  { f: 'elo_pawn_breakthrough', k: 'pawn_breakthrough', n: 'Prielomy' },
  { f: 'elo_direct_attack',     k: 'direct_attack',     n: 'Brania so ziskom' },
  { f: 'elo_underdefended',     k: 'underdefended',     n: 'Slabo pokryté' },
  { f: 'elo_pin',               k: 'pin',               n: 'Abs. väzby' },
  { f: 'elo_relative_pin',      k: 'relative_pin',      n: 'Rel. väzby' },
  { f: 'elo_fork',              k: 'fork',              n: 'Vidličky' },
  { f: 'elo_direct_threat',     k: 'direct_threat',     n: 'Hrozby' }
];
const BASIC_COLS = [
  { f: 'elo_taktika',   k: 'taktika',   n: 'Taktika' },
  { f: 'elo_strategia', k: 'strategia', n: 'Stratégia' },
  { f: 'elo_koncovka',  k: 'koncovka',  n: 'Koncovka' },
  { f: 'elo',           k: 'mix',       n: 'Mix' }
];
const DEF_SKILL = 1200, DEF_BASIC = 1000;
const ALL_FIELDS = [...new Set([...SKILL_COLS, ...BASIC_COLS].map(c => c.f))].join(',');

function goHome() { location.href = 'index.html'; }
function setStatus(t, type = '') {
  const el = document.getElementById('status');
  el.textContent = t; el.className = 'status no-print' + (type ? ' ' + type : '');
  el.style.display = t ? '' : 'none';
}

async function sbFetchAll(query) {
  const PAGE = 1000; let all = [], off = 0;
  while (true) {
    const sep = query.includes('?') ? '&' : '?';
    const b = await sbFetch(`${query}${sep}limit=${PAGE}&offset=${off}`);
    if (!b || !b.length) break;
    all = all.concat(b);
    if (b.length < PAGE) break;
    off += PAGE;
  }
  return all;
}

function fmtTime(sec) {
  const s = Number(sec || 0), h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h ? `${h} h ${m} min` : `${m} min`;
}
function monthName(ym) {
  const M = ['január','február','marec','apríl','máj','jún','júl','august','september','október','november','december'];
  const [y, m] = ym.split('-').map(Number);
  return `${M[m - 1]} ${y}`;
}
function delta(d) {
  if (d > 0) return `<span class="up">+${d}</span>`;
  if (d < 0) return `<span class="down">${d}</span>`;
  return '<span class="flat">0</span>';
}

// ─── Zostavenie reportu ──────────────────────────────────────────────────────
async function build() {
  const ym = document.getElementById('month').value;
  if (!ym) { setStatus('Vyber mesiac.', 'error'); return; }
  setStatus('Zostavujem report...');
  document.getElementById('report').innerHTML = '';

  const [Y, M] = ym.split('-').map(Number);
  const start = new Date(Y, M - 1, 1);
  const end   = new Date(Y, M, 1);
  const startISO = start.toISOString(), endISO = end.toISOString();

  try {
    // 1) Hráči skupiny (bez trénerov a adminov)
    // Konkrétna zvolená skupina, inak všetky, ku ktorým má prihlásený prístup
    const tf = document.getElementById('trenerSelect').value;
    let q = `players?select=id,name,surname,${ALL_FIELDS},profile:profiles!user_id(role)&order=surname.asc,name.asc`;
    if (tf && tf !== 'all') q += `&trener_id=eq.${tf}`;
    else q = filterSkupiny(q, await viditelneSkupiny());
    const STAFF = ['trener', 'hlavny_trener', 'admin'];
    const players = (await sbFetchAll(q) || []).filter(p => !STAFF.includes(p.profile?.role));

    if (!players.length) { setStatus('Táto skupina nemá žiadnych hráčov.', 'error'); return; }
    const ids = players.map(p => p.id).join(',');

    // 2) Aktivita za mesiac
    // puzzle_id treba na počítanie UNIKÁTNYCH vyriešených úloh (opakované riešenie
    // tej istej pozície sa počíta ako jeden výsledok), source na oddelenie
    // klasického tréningu od zručností. POZOR: puzzles.id a skill_puzzles.id sa
    // prekrývajú, takže úloha je jednoznačná až párom source + puzzle_id.
    const log = await sbFetchAll(
      `training_log?player_id=in.(${ids})&created_at=gte.${startISO}&created_at=lt.${endISO}&select=player_id,puzzle_id,source,result,time_spent,loss_reason,created_at`
    );

    // 3) História ELO do konca mesiaca (na výpočet stavu pred obdobím aj po ňom)
    const hist = await sbFetchAll(
      `elo_history?player_id=in.(${ids})&created_at=lt.${endISO}&select=player_id,category,elo_value,created_at&order=created_at.asc,id.asc`
    );

    // 4) Zadania
    const asg = await sbFetchAll(`assignments?player_id=in.(${ids})&select=*`);

    render(ym, players, log, hist, asg, startISO);
    setStatus('');
  } catch (e) {
    setStatus('Chyba pri zostavovaní: ' + e.message, 'error');
  }
}

// Posun ELO za obdobie: stav pred začiatkom (alebo východisková hodnota)
// a posledný stav v období.
function eloMoves(pid, hist, startISO) {
  const out = [];
  [...SKILL_COLS, ...BASIC_COLS].forEach(c => {
    const rows = hist.filter(h => h.player_id === pid && h.category === c.k);
    if (!rows.length) return;
    const before = rows.filter(h => h.created_at < startISO);
    const inside = rows.filter(h => h.created_at >= startISO);
    if (!inside.length) return;                       // v tomto mesiaci sa nehýbalo
    const isSkill = SKILL_COLS.some(s => s.k === c.k);
    const base = before.length ? Number(before[before.length - 1].elo_value)
                               : (isSkill ? DEF_SKILL : DEF_BASIC);
    const now  = Number(inside[inside.length - 1].elo_value);
    if (now !== base) out.push({ n: c.n, base, now, d: now - base });
  });
  return out.sort((a, b) => b.d - a.d);
}

function render(ym, players, log, hist, asg, startISO) {
  const today = todayLocal();

  // Aktivita jedného zdroja: pokusy, unikátne vyriešené úlohy a čas.
  // Vyriešené sa počíta cez množinu puzzle_id, takže opakované riešenie
  // tej istej pozície zvýši pokusy, ale nie počet vyriešených úloh.
  function activity(rows) {
    const solvedIds = new Set();
    rows.forEach(l => { if (l.result === 'win') solvedIds.add(l.puzzle_id); });
    return {
      attempts: rows.length,
      solved:   solvedIds.size,
      time:     rows.reduce((s, l) => s + Number(l.time_spent || 0), 0)
    };
  }

  // Údaje na hráča
  const data = players.map(p => {
    const all     = log.filter(l => l.player_id === p.id);
    const classic = activity(all.filter(l => l.source === 'puzzles'));
    const skills  = activity(all.filter(l => l.source === 'skill_puzzles'));
    // Staré záznamy bez zdroja sa nedajú priradiť — do štatistík nevstupujú
    const unknown = all.filter(l => !l.source).length;

    const counted = all.filter(l => l.source === 'puzzles' || l.source === 'skill_puzzles');
    const rows    = classic.attempts + skills.attempts;
    const solved  = classic.solved + skills.solved;
    const time    = classic.time + skills.time;
    const days    = new Set(counted.map(l => localDay(l.created_at))).size;
    const moves   = eloMoves(p.id, hist, startISO);
    const mine    = asg.filter(a => a.player_id === p.id);
    const overdue = mine.filter(a => !a.completed_at && a.deadline && a.deadline < today).length;

    // Prečo hráč neuspel. Rozdiel medzi chybou a vypršaným časom je pre trénera
    // zásadný: prvé znamená, že vzor nepozná, druhé že ho rozpoznáva pomaly.
    const prehry = counted.filter(l => l.result === 'loss');
    const dovody = { chyba: 0, cas: 0, riesenie: 0, odchod: 0, neznamy: 0 };
    prehry.forEach(l => {
      const d = l.loss_reason;
      if (d && dovody[d] !== undefined) dovody[d]++;
      else dovody.neznamy++;    // staré záznamy spred zavedenia stĺpca
    });

    // Najslabšia zručnosť (aktuálny stav)
    const weakest = SKILL_COLS
      .map(c => ({ n: c.n, v: Number(p[c.f] ?? DEF_SKILL) }))
      .sort((a, b) => a.v - b.v)[0];

    return { p, rows, solved, time, days, classic, skills, unknown,
             moves, mine, overdue, weakest, prehry: prehry.length, dovody,
             name: `${p.surname || ''} ${p.name || ''}`.trim() || '(bez mena)' };
  });

  const active  = data.filter(d => d.rows > 0);
  const idle    = data.filter(d => d.rows === 0);
  const totalC  = data.reduce((s, d) => s + d.classic.solved, 0);
  const totalS  = data.reduce((s, d) => s + d.skills.solved, 0);
  const totalT  = data.reduce((s, d) => s + d.time, 0);
  const totalU  = data.reduce((s, d) => s + d.unknown, 0);
  const overdue = data.filter(d => d.overdue > 0);

  // Najslabšie zručnosti skupiny (aktuálny stav)
  const colAvg = SKILL_COLS.map(c => ({
    n: c.n,
    a: players.reduce((s, p) => s + Number(p[c.f] ?? DEF_SKILL), 0) / players.length
  })).sort((x, y) => x.a - y.a);

  const groupName = IS_TRENER ? `Skupina — ${USER_NICK}`
    : (document.getElementById('trenerSelect').selectedOptions[0]?.textContent || 'Všetci hráči');

  // Poradie: najprv tí, čo potrebujú pozornosť
  data.sort((a, b) => {
    if ((a.rows === 0) !== (b.rows === 0)) return a.rows === 0 ? -1 : 1;
    if ((a.overdue > 0) !== (b.overdue > 0)) return a.overdue > 0 ? -1 : 1;
    return a.solved - b.solved;   // najmenej vyriešených úloh hore
  });

  let h = `<div class="rep-head">
      <div class="rep-title">Mesačný report — ${monthName(ym)}</div>
      <div class="rep-sub">${groupName} · ${players.length} hráčov · zostavené ${new Date().toLocaleDateString('sk-SK')}</div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="n">${totalC}</div><div class="l">Klasický tréning</div></div>
      <div class="tile"><div class="n">${totalS}</div><div class="l">Zručnosti</div></div>
      <div class="tile"><div class="n">${fmtTime(totalT)}</div><div class="l">Čas spolu</div></div>
      <div class="tile"><div class="n">${active.length}</div><div class="l">Trénovalo</div></div>
      <div class="tile ${idle.length ? 'warn' : ''}"><div class="n">${idle.length}</div><div class="l">Netrénovalo</div></div>
    </div>

    <div class="focus" style="background:#f8fafc;border-color:#e2e8f0;color:#475569;">
      Počty sú <strong>unikátne vyriešené úlohy</strong> — opakované riešenie tej istej pozície
      sa počíta ako pokus, nie ako nová vyriešená úloha.${totalU
        ? ` Nezahrnutých je ${totalU} starších záznamov bez určeného zdroja.` : ''}</div>

    <div class="focus">🎯 <strong>Na čo zamerať tréning:</strong>
      ${colAvg.slice(0, 2).map(c => `${c.n} (${Math.round(c.a)})`).join(', ')} — najnižší priemer v skupine.</div>`;

  // Upozornenia
  if (idle.length || overdue.length) {
    h += `<div class="warn-box"><strong>Vyžaduje pozornosť</strong><ul>`;
    if (idle.length)    h += `<li>Celý mesiac netrénovali: ${idle.map(d => escapeHtml(d.name)).join(', ')}</li>`;
    if (overdue.length) h += `<li>Zadanie po termíne: ${overdue.map(d => `${escapeHtml(d.name)} (${d.overdue})`).join(', ')}</li>`;
    h += `</ul></div>`;
  }

  // Bloky hráčov
  h += `<div class="sec-title">Hráči</div>`;
  h += data.map(d => {
    const done = d.mine.filter(a => a.completed_at).length;
    const openA = d.mine.length - done;
    const moves = d.moves.length
      ? `<div class="chips">${d.moves.map(m =>
          `<span class="chip">${m.n}: ${m.base}→${m.now} ${delta(m.d)}</span>`).join('')}</div>`
      : `<div class="pb-line flat">Bez pohybu ELO v tomto mesiaci.</div>`;

    return `<div class="pb ${d.rows === 0 ? 'idle' : ''}">
      <div class="pb-top">
        <span class="pb-name">${escapeHtml(d.name)}</span>
        ${d.rows === 0
          ? '<span class="pb-tag idle">netrénoval</span>'
          : `<span class="pb-tag ok">${d.days} ${d.days === 1 ? 'deň' : (d.days < 5 ? 'dni' : 'dní')} tréningu</span>`}
      </div>
      <div class="pb-line"><span class="lbl">Klasický tréning:</span> ${d.classic.solved} vyriešených${
        d.classic.attempts > d.classic.solved ? ` (${d.classic.attempts} pokusov)` : ''} · ${fmtTime(d.classic.time)}</div>
      <div class="pb-line"><span class="lbl">Zručnosti:</span> ${d.skills.solved} vyriešených${
        d.skills.attempts > d.skills.solved ? ` (${d.skills.attempts} pokusov)` : ''} · ${fmtTime(d.skills.time)}</div>
      <div class="pb-line"><span class="lbl">Posun ELO:</span></div>
      ${moves}
      ${d.prehry ? `<div class="pb-line"><span class="lbl">Neúspešné pokusy:</span> ${d.prehry}${
        (() => {
          const c = [];
          if (d.dovody.chyba)    c.push(`${d.dovody.chyba}× chybný ťah`);
          if (d.dovody.cas)      c.push(`<strong>${d.dovody.cas}× nestihol čas</strong>`);
          if (d.dovody.riesenie) c.push(`${d.dovody.riesenie}× pozrel riešenie`);
          if (d.dovody.odchod)   c.push(`${d.dovody.odchod}× opustil úlohu`);
          return c.length ? ' — ' + c.join(', ') : '';
        })()
      }</div>` : ''}
      <div class="pb-line"><span class="lbl">Najslabšia zručnosť:</span> ${d.weakest.n} (${d.weakest.v})</div>
      <div class="pb-line"><span class="lbl">Zadania:</span> ${d.mine.length
        ? `${openA} otvorených, ${done} uzavretých${d.overdue ? ` · <span class="down">${d.overdue} po termíne</span>` : ''}`
        : 'žiadne'}</div>
    </div>`;
  }).join('');

  h += `<div class="links no-print">
      <a href="slabinova-mapa.html">→ Slabinová mapa</a>
      <a href="zadania-prehlad.html">→ Prehľad zadaní</a>
    </div>`;

  document.getElementById('report').innerHTML = h;
}

// ─── Inicializácia ───────────────────────────────────────────────────────────
async function init() {
  if (!requireLogin()) return;
  if (IS_HRAC) { alert('Report je dostupný len pre trénerov a administrátorov.'); goHome(); return; }

  // Predvolený mesiac = aktuálny
  const n = new Date();
  document.getElementById('month').value =
    `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`;

  // Výber skupiny sa zobrazí každému, kto má prístup k viac než jednej
  if (!await naplnVyberSkupin(document.getElementById('trenerSelect'))) {
    document.getElementById('groupField').style.display = 'none';
  }
}

init();
</script>
</body>
</html>
