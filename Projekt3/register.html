<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Registrácia hráča</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f6;
  display: flex;
  justify-content: center;
  padding: 30px;
  margin: 0;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 12px;
  width: min(900px, 100%);
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

h2, h3 {
  margin-top: 0;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  box-sizing: border-box;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
}

.buttons-top {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

button {
  padding: 10px 12px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
}

.primary { background: #111827; color: white; }
.secondary { background: #e5e7eb; color: #111827; }
.danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

.player-list { display: grid; gap: 10px; }

.player-card {
  border: 1px solid #d1d5db;
  border-radius: 12px;
  padding: 14px;
  background: #ffffff;
}

.player-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.player-name { font-size: 18px; font-weight: bold; color: #111827; }

.player-elo {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 999px;
  background: #eff6ff;
  color: #1d4ed8;
  border: 1px solid #93c5fd;
  font-weight: bold;
  font-size: 13px;
}

/* Badge trénera — vidí len admin */
.trener-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  background: #f0fdf4;
  color: #166534;
  border: 1px solid #86efac;
  font-size: 12px;
  margin-left: 8px;
}

.player-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: auto;
  gap: 8px;
  margin-bottom: 12px;
}

.stat-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 10px 8px;
  text-align: center;
}

.stat-label {
  display: block;
  font-size: 11px;
  color: #64748b;
  margin-bottom: 4px;
  text-transform: uppercase;
}

.stat-value { font-size: 18px; font-weight: bold; color: #0f172a; }

.player-time {
  margin-bottom: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #faf5ff;
  border: 1px solid #d8b4fe;
  color: #6b21a8;
  font-size: 14px;
}

.player-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.selected-info {
  margin-top: 16px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
  background: #f8fafc;
  color: #334155;
}

.empty { color: #64748b; font-style: italic; }

/* Info banner pre trénera */
.role-banner {
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 16px;
  font-size: 14px;
}
.role-banner.trener {
  background: #f0fdf4;
  border: 1px solid #86efac;
  color: #166534;
}
.role-banner.admin {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  color: #1d4ed8;
}

/* Skrytý prvok */
.hidden { display: none !important; }

@media (max-width: 800px) {
  .player-stats { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 640px) {
  .player-top { flex-direction: column; align-items: flex-start; }
  .player-stats { grid-template-columns: 1fr; }
  .player-actions button { flex: 1 1 auto; }
}
</style>
</head>

<body>
<div class="container">
  <h2>Registrácia hráča</h2>

  <!-- Role banner — zobrazí sa po načítaní -->
  <div id="roleBanner" class="role-banner hidden"></div>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">
    <input id="nameInput" placeholder="Meno *">
    <input id="surnameInput" placeholder="Priezvisko">
    <input id="emailInput" type="email" placeholder="E-mail">
    <input id="eloInput" type="number" placeholder="ELO (prázdne = 1500)">
  </div>

  <!-- Výber trénera — vidí len admin pri vytváraní hráča -->
  <div id="trenerSelectWrap" class="hidden" style="margin-bottom:8px;">
    <select id="trenerSelect">
      <option value="">— bez trénera —</option>
    </select>
  </div>

  <div class="buttons-top">
    <button class="primary" onclick="create()">Vytvoriť hráča</button>
    <button class="secondary" onclick="back()">Späť do menu</button>
  </div>

  <h3>Zoznam hráčov</h3>
  <div id="players" class="player-list"></div>

  <div id="selectedInfo" class="selected-info">Aktuálne vybraný hráč: nikto</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/player.js"></script>
<script>
// ─── Kontext prihláseného používateľa ───────────────────────────────────────
const USER_ROLE = sessionStorage.getItem('user_role') || '';
const USER_ID   = sessionStorage.getItem('user_id') || '';
const IS_ADMIN  = USER_ROLE === 'admin';
const IS_TRENER = USER_ROLE === 'trener';

// Mapa trénerov: UUID → meno (pre admin view)
let trenerMap = {};

// ─── Inicializácia ───────────────────────────────────────────────────────────
async function init() {
  // Role banner
  const banner = document.getElementById('roleBanner');
  if (IS_TRENER) {
    const nick = sessionStorage.getItem('user_nick') || sessionStorage.getItem('user_name') || 'Tréner';
    banner.textContent = `👤 Zobrazujem hráčov trénera: ${nick}`;
    banner.className = 'role-banner trener';
    banner.classList.remove('hidden');
  } else if (IS_ADMIN) {
    banner.textContent = '🔧 Admin — zobrazujem všetkých hráčov';
    banner.className = 'role-banner admin';
    banner.classList.remove('hidden');

    // Admin môže vybrať trénera pri vytváraní hráča
    await loadTrainerSelect();
    document.getElementById('trenerSelectWrap').classList.remove('hidden');
  }

  await render();
}

// ─── Načítaj trénerov do select (pre admina) ────────────────────────────────
async function loadTrainerSelect() {
  const trainers = await getTrainers();
  const sel = document.getElementById('trenerSelect');

  // Zostav mapu id → meno
  trainers.forEach(t => {
    const name = t.nick_name || `${t.name || ''} ${t.surname || ''}`.trim();
    trenerMap[t.id] = name;

    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = name;
    sel.appendChild(opt);
  });
}

// ─── Pomocné funkcie ─────────────────────────────────────────────────────────
function percent(solved, played) {
  if (!played) return 0;
  return Math.round((solved / played) * 100);
}

function formatTotalTime(totalSeconds) {
  const safe = Math.max(0, Math.floor(Number(totalSeconds) || 0));
  const hours = Math.floor(safe / 3600);
  const minutes = Math.floor((safe % 3600) / 60);
  const seconds = safe % 60;
  return String(hours).padStart(2, '0') + ':' +
         String(minutes).padStart(2, '0') + ':' +
         String(seconds).padStart(2, '0');
}

// ─── Render zoznamu hráčov ───────────────────────────────────────────────────
async function render() {
  // Filtrovanie podľa roly
  const trenerFilter = IS_TRENER ? USER_ID : null;
  const list = await loadPlayers(trenerFilter);
  const el = document.getElementById("players");
  const selected = await getCurrentPlayer();

  el.innerHTML = "";

  if (!list.length) {
    el.innerHTML = IS_TRENER
      ? '<div class="empty">Zatiaľ nemáš žiadnych hráčov.</div>'
      : '<div class="empty">Zatiaľ nie je vytvorený žiadny hráč.</div>';
    return;
  }

  list.forEach(p => {
    const played = Number(p.played) || 0;
    const solved = Number(p.solved) || 0;
    const accuracy = percent(solved, played);
    const totalTime = formatTotalTime(p.total_time || p.totalTime || 0);

    // Meno trénera — len pre admin
    const trenerName = IS_ADMIN && p.trener_id
      ? (trenerMap[p.trener_id] || '?')
      : null;

    const card = document.createElement("div");
    card.className = "player-card";
    card.innerHTML = `
      <div class="player-top">
        <div class="player-name">
          ${p.name} ${p.surname || ''}
          ${trenerName ? `<span class="trener-badge">🧑‍🏫 ${trenerName}</span>` : ''}
        </div>
        <div class="player-elo">ELO ${p.elo}</div>
      </div>
      ${p.email ? `<div style="font-size:13px; color:#64748b; margin-bottom:10px;">📧 ${p.email}</div>` : ''}
      <div class="player-stats">
        <div class="stat-box">
          <span class="stat-label">Riešené</span>
          <div class="stat-value">${played}</div>
        </div>
        <div class="stat-box">
          <span class="stat-label">Vyriešené</span>
          <div class="stat-value">${solved}</div>
        </div>
        <div class="stat-box">
          <span class="stat-label">Úspešnosť</span>
          <div class="stat-value">${accuracy}%</div>
        </div>
        <div class="stat-box">
          <span class="stat-label">ELO Mix</span>
          <div class="stat-value">${p.elo}</div>
        </div>
        <div class="stat-box">
          <span class="stat-label">ELO Taktika</span>
          <div class="stat-value">${p.elo_taktika || p.elo}</div>
        </div>
        <div class="stat-box">
          <span class="stat-label">ELO Stratégia</span>
          <div class="stat-value">${p.elo_strategia || p.elo}</div>
        </div>
        <div class="stat-box">
          <span class="stat-label">ELO Koncovka</span>
          <div class="stat-value">${p.elo_koncovka || p.elo}</div>
        </div>
        <div class="stat-box">
          <span class="stat-label">ELO Zručnosti</span>
          <div class="stat-value">${p.elo_zrucnosti || 1500}</div>
        </div>
      </div>
      <div class="player-time">
        <strong>Celkový čas tréningu:</strong> ${totalTime}
      </div>
      <div class="player-actions">
        <button class="primary">Vybrať hráča</button>
        <button class="danger">Vymazať hráča</button>
      </div>
    `;

    card.querySelector(".primary").onclick = async () => {
      setCurrentPlayer(p.id);
      await render();
    };

    card.querySelector(".danger").onclick = async () => {
      if (!confirm(`Naozaj chceš vymazať hráča "${p.name}"? Táto akcia je nevratná.`)) return;
      await deletePlayer(p.id);
      await render();
    };

    el.appendChild(card);
  });

  // Aktuálne vybraný hráč
  const info = document.getElementById("selectedInfo");
  if (selected) {
    const played = Number(selected.played) || 0;
    const solved = Number(selected.solved) || 0;
    const accuracy = percent(solved, played);
    const totalTime = formatTotalTime(selected.total_time || selected.totalTime || 0);
    info.textContent =
      `Aktuálne vybraný hráč: ${selected.name} | ELO ${selected.elo} | Úspešnosť ${accuracy}% | Celkový čas ${totalTime}`;
  } else {
    info.textContent = "Aktuálne vybraný hráč: nikto";
  }
}

// ─── Vytvorenie hráča ────────────────────────────────────────────────────────
async function create() {
  const name = document.getElementById("nameInput").value.trim();
  const surname = document.getElementById("surnameInput").value.trim();
  const email = document.getElementById("emailInput").value.trim();
  const eloRaw = document.getElementById("eloInput").value.trim();
  const elo = eloRaw ? Number(eloRaw) : 1500;

  if (!name) {
    alert("Zadaj meno hráča.");
    return;
  }

  if (eloRaw && (isNaN(elo) || elo < 100 || elo > 3000)) {
    alert("ELO musí byť číslo medzi 100 a 3000.");
    return;
  }

  // Určenie trener_id
  let trenerId = null;
  if (IS_TRENER) {
    // Tréner vytvorí hráča — automaticky sa priradi k nemu
    trenerId = USER_ID;
  } else if (IS_ADMIN) {
    // Admin môže vybrať trénera zo selectu
    const sel = document.getElementById('trenerSelect');
    trenerId = sel ? sel.value || null : null;
  }

  await createPlayer(name, surname, email, elo, trenerId);

  // Vymazať formulár
  document.getElementById("nameInput").value = "";
  document.getElementById("surnameInput").value = "";
  document.getElementById("emailInput").value = "";
  document.getElementById("eloInput").value = "";
  if (IS_ADMIN) document.getElementById("trenerSelect").value = "";

  await render();
}

function back() {
  location.href = "index.html";
}

// ─── Štart ───────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
