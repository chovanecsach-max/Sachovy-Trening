<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa koncoviek</title>
<style>
body { font-family: Arial, sans-serif; background: #f4f4f6; margin: 0; padding: 12px; color: #111827; }
.app { max-width: 1150px; margin: 0 auto; background: white; border-radius: 14px;
       box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 20px; }
h1 { margin: 0 0 6px 0; text-align: center; font-size: 26px; }
.subtitle { text-align: center; color: #475569; margin: 0 0 18px 0; }

.role-banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; text-align: center; }
.role-banner.trener        { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
.role-banner.hlavny_trener { background: #faf5ff; border: 1px solid #d8b4fe; color: #6b21a8; }
.role-banner.admin         { background: #fff7ed; border: 1px solid #fdba74; color: #c2410c; }

.filter-card { border: 1px solid #d1d5db; border-radius: 12px; padding: 14px; margin-bottom: 14px; background: #f8fafc; }
.filter-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.filter-field { display: flex; flex-direction: column; gap: 4px; }
.filter-field label { font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: bold; }
select { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: white; min-width: 200px; }
input[type="date"] { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: white; }
/* Riadok s priemerným ELO za zvolené obdobie v bunke mapy */
.cell .p { font-size: 11px; font-weight: 700; margin-top: 2px; opacity: .95; }
button { padding: 10px 16px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; }
.secondary { background: #e5e7eb; color: #111827; }

.status { margin: 12px 0; padding: 10px; border-radius: 10px; border: 1px solid #d1d5db;
          background: #f8fafc; color: #334155; font-size: 14px; }
.status.error { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }

.focus-line { margin: 4px 0 12px; padding: 12px 14px; border-radius: 10px;
              background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a5f; font-size: 14px; display: none; }
.focus-line strong { color: #1d4ed8; }
.warn-line { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: #fffbeb;
             border: 1px solid #fde68a; color: #92400e; font-size: 13px; }

.map-legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 12px; color: #64748b; margin: 6px 0 10px; }
.map-legend .box { width: 13px; height: 13px; border-radius: 3px; display: inline-block; vertical-align: -2px; margin-right: 5px; }

.map-wrap { overflow-x: auto; }
table.map { border-collapse: separate; border-spacing: 3px; font-size: 12px; width: 100%; min-width: 720px; }
table.map th { padding: 4px 3px; color: #64748b; font-weight: bold; font-size: 11px; line-height: 1.2; vertical-align: bottom; text-align: center; }
table.map th.name-h { text-align: left; padding-left: 8px; }
table.map td.name { padding: 7px 8px; white-space: nowrap; color: #111827; }
table.map td.cell { text-align: center; padding: 6px 5px; border-radius: 5px; line-height: 1.25; }
table.map td.cell .n { font-weight: bold; font-size: 13px; }
table.map td.cell .e { font-size: 10px; opacity: .75; }
table.map tr.avg-row td { border-top: 2px solid #e5e7eb; padding-top: 8px; }
table.map td.avg-name { font-weight: bold; white-space: nowrap; padding-left: 8px; }
.thin { font-size: 10px; color: #b45309; }

/* ── Zadávanie úloh ── */
.action-card { border: 1px solid #d1d5db; border-radius: 12px; padding: 14px; margin: 16px 0 4px; background: #f8fafc; }
.action-card .filter-row { align-items: flex-end; }
.primary { background: #111827; color: white; font-weight: bold; }
input[type="number"] { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: white; width: 110px; }
input[type="text"], input[type="date"] { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: white; }
input[type="text"] { min-width: 190px; }
.below-result { margin-top: 12px; border-top: 1px solid #e2e8f0; padding-top: 12px; }
.below-head { font-size: 14px; font-weight: bold; margin-bottom: 8px; }
.below-tools { font-size: 12px; margin-bottom: 8px; }
.below-tools a { color: #1d4ed8; cursor: pointer; text-decoration: underline; margin-right: 10px; }
.below-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.below-list li { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.below-list label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.below-list .val { font-weight: bold; padding: 2px 7px; border-radius: 5px; }
.below-none { font-size: 13px; color: #166534; background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 10px 12px; }
.assign-box { margin-top: 14px; border-top: 1px dashed #cbd5e1; padding-top: 12px; }
.asg-status { margin-top: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13px; }
.asg-status.ok  { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
.asg-status.err { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; }
</style>
</head>

<body oncontextmenu="return false;">
<div class="app">
  <h1>♚ Mapa koncoviek</h1>
  <p class="subtitle">Koľko koncoviek ktorého typu hráči odtrénovali — a čo ešte nemali v ruke.</p>

  <div id="roleBanner" class="role-banner" style="display:none;"></div>

  <div class="filter-card" id="filterCard" style="display:none;">
    <div class="filter-row">
      <div class="filter-field" id="groupField">
        <label>Skupina (tréner)</label>
        <select id="trenerSelect"><option value="all">Všetci hráči</option></select>
      </div>
      <div class="filter-field">
        <label>Obdobie od</label>
        <input type="date" id="dateFrom">
      </div>
      <div class="filter-field">
        <label>Obdobie po</label>
        <input type="date" id="dateTo">
      </div>
      <div class="filter-field">
        <label>Rýchlo</label>
        <select id="periodPreset">
          <option value="3">Posledné 3 mesiace</option>
          <option value="6">Posledných 6 mesiacov</option>
          <option value="12">Posledných 12 mesiacov</option>
          <option value="0">Celé obdobie</option>
          <option value="custom">Vlastné</option>
        </select>
      </div>
      <button class="secondary" onclick="goSlabiny()">← Slabinová mapa</button>
      <button class="secondary" onclick="goHome()">Späť do menu</button>
    </div>
  </div>

  <div id="status" class="status">Načítavam...</div>
  <div id="focusLine" class="focus-line"></div>
  <div id="warnLine"></div>

  <div class="map-legend" id="mapLegend" style="display:none;">
    <span><span class="box" style="background:#fff;border:1px dashed #cbd5e1;"></span>nevyskúšané</span>
    <span><span class="box" style="background:#fee2e2;border:1px solid #fca5a5;"></span>1–2</span>
    <span><span class="box" style="background:#fed7aa;border:1px solid #fdba74;"></span>3–5</span>
    <span><span class="box" style="background:#fef08a;border:1px solid #fde047;"></span>6–9</span>
    <span><span class="box" style="background:#bbf7d0;border:1px solid #86efac;"></span>10 a viac</span>
    <span style="color:#94a3b8;">číslo = vyriešené / pokusy · Ø = priemerné ELO vyriešených</span>
  </div>

  <div class="action-card" id="actionCard" style="display:none;">
    <div class="filter-row">
      <div class="filter-field">
        <label>Typ koncovky</label>
        <select id="thrType"></select>
      </div>
      <div class="filter-field">
        <label>Menej než (vyriešených)</label>
        <input type="number" id="thrValue" min="1" max="100" step="1" value="3">
      </div>
      <button class="primary" onclick="showBelow()">Kto má málo</button>
    </div>
    <div id="belowResult" class="below-result" style="display:none;"></div>
  </div>

  <div class="map-wrap">
    <table class="map" id="mapTable" style="display:none;">
      <thead id="mapHead"></thead>
      <tbody id="mapBody"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/player.js"></script>
<script>
const USER_ROLE        = sessionStorage.getItem('user_role') || '';
const USER_ID          = sessionStorage.getItem('user_id') || '';
const USER_NICK        = sessionStorage.getItem('user_nick') || sessionStorage.getItem('user_name') || '';
const IS_ADMIN         = USER_ROLE === 'admin';
const IS_TRENER        = USER_ROLE === 'trener';
const IS_HLAVNY_TRENER = USER_ROLE === 'hlavny_trener';
const IS_HRAC          = USER_ROLE === 'hrac';
const STAFF_ROLES      = ['trener', 'hlavny_trener', 'admin'];

// Pri malom počte vyriešených úloh je priemerné ELO len orientačné
const THIN_EVIDENCE = 3;

let mapStats = {}, mapPlayers = [];
let mapLog   = [];      // surové záznamy z training_log — obdobie sa prepočíta bez nového dotazu
let egPuzzles = null;   // id → { type, elo }
let egTypes   = [];     // typy koncoviek zoradené podľa počtu úloh

// ─── Zvolené obdobie ────────────────────────────────────────────────────────
// Pokrytie (koľko typov už hráč zvládol) je zo svojej podstaty kumulatívne,
// preto sa počíta vždy z celej histórie. Obdobie sa týka len priemerného ELA,
// aby sa dalo porovnať "ako to vyzerá celkovo" s "ako to vyzerá teraz".
function periodBounds() {
  const f = document.getElementById('dateFrom').value;
  const t = document.getElementById('dateTo').value;
  if (!f || !t) return null;
  const from = new Date(f + 'T00:00:00').getTime();
  const to   = new Date(t + 'T23:59:59.999').getTime();
  if (isNaN(from) || isNaN(to) || from > to) return null;
  return { from, to, label: `${f} – ${t}` };
}

function applyPreset() {
  const raw = document.getElementById('periodPreset').value;
  if (raw === 'custom') return;                 // dátumy si nastavuje používateľ sám
  const m = Number(raw);
  const fromEl = document.getElementById('dateFrom');
  const toEl   = document.getElementById('dateTo');
  if (!m) { fromEl.value = ''; toEl.value = ''; return; }   // 0 = celé obdobie
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - m, now.getDate());
  fromEl.value = start.toISOString().substring(0, 10);
  toEl.value   = now.toISOString().substring(0, 10);
}

function goHome()    { location.href = 'index.html'; }
function goSlabiny() { location.href = 'slabinova-mapa.html'; }

function setStatus(t, type = '') {
  const el = document.getElementById('status');
  el.textContent = t; el.className = 'status' + (type ? ' ' + type : '');
  el.style.display = t ? '' : 'none';
}

async function sbFetchAll(query) {
  const PAGE = 1000; let all = [], off = 0;
  while (true) {
    const sep = query.includes('?') ? '&' : '?';
    const b = await sbFetch(`${query}${sep}limit=${PAGE}&offset=${off}`);
    if (!b || !b.length) break;
    all = all.concat(b);
    if (b.length < PAGE) break;
    off += PAGE;
  }
  return all;
}

// ─── Farba podľa pokrytia (počet vyriešených) ───────────────────────────────
function coverColor(solved) {
  if (solved === 0) return { bg: '#ffffff', fg: '#94a3b8', border: '1px dashed #cbd5e1' };
  if (solved <= 2)  return { bg: '#fee2e2', fg: '#991b1b', border: '1px solid #fca5a5' };
  if (solved <= 5)  return { bg: '#fed7aa', fg: '#9a3412', border: '1px solid #fdba74' };
  if (solved <= 9)  return { bg: '#fef08a', fg: '#854d0e', border: '1px solid #fde047' };
  return              { bg: '#bbf7d0', fg: '#166534', border: '1px solid #86efac' };
}

function cellHtml(st, per, period) {
  const c = coverColor(st.solved);
  if (!st.attempts) {
    return `<td class="cell" style="background:${c.bg};color:${c.fg};border:${c.border};"
            title="Tento typ koncovky hráč ešte netrénoval">–</td>`;
  }
  const thin    = st.solved > 0 && st.solved < THIN_EVIDENCE;
  const avgAll  = st.solved ? Math.round(st.eloSum / st.solved) : null;
  const elo     = avgAll ? `<div class="e">Ø${avgAll}${thin ? ' *' : ''}</div>` : '';

  // Riadok za zvolené obdobie — len ak je obdobie nastavené
  let perLine = '', perTip = '';
  if (period && per) {
    if (!per.attempts) {
      perLine = `<div class="p" style="opacity:.5;">–</div>`;
      perTip  = ` · za obdobie netrénoval`;
    } else if (!per.solved) {
      perLine = `<div class="p" style="opacity:.7;">0/${per.attempts}</div>`;
      perTip  = ` · za obdobie 0 vyriešených z ${per.attempts} pokusov`;
    } else {
      const avgPer = Math.round(per.eloSum / per.solved);
      const d      = avgAll ? avgPer - avgAll : 0;
      const arrow  = d > 0 ? `▲${d}` : (d < 0 ? `▼${Math.abs(d)}` : '=');
      const thinP  = per.solved < THIN_EVIDENCE ? ' *' : '';
      perLine = `<div class="p">Ø${avgPer}${thinP} <span style="font-weight:600;">${arrow}</span></div>`;
      perTip  = ` · za obdobie ${per.solved} vyriešených z ${per.attempts} pokusov`
              + `, priemerné ELO ${avgPer}`
              + (avgAll ? ` (oproti celku ${d > 0 ? '+' : ''}${d})` : '');
    }
  }

  const tip = `${st.solved} vyriešených z ${st.attempts} pokusov`
            + (avgAll ? ` · priemerné ELO vyriešených ${avgAll}` : '')
            + (thin ? ' (málo úloh — orientačné)' : '')
            + perTip;

  return `<td class="cell" style="background:${c.bg};color:${c.fg};border:${c.border};" title="${tip}">
            <div class="n">${st.solved}/${st.attempts}</div>${elo}${perLine}</td>`;
}

// ─── Načítanie ───────────────────────────────────────────────────────────────
async function fetchPlayers(trenerFilter) {
  const cols = 'id,name,surname,profile:profiles!user_id(role)';
  let q = `players?select=${cols}&order=surname.asc,name.asc`;
  if (IS_TRENER)                                   q += `&trener_id=eq.${USER_ID}`;
  else if (trenerFilter && trenerFilter !== 'all') q += `&trener_id=eq.${trenerFilter}`;
  const rows = await sbFetchAll(q);
  return (rows || []).filter(p => !STAFF_ROLES.includes(p.profile?.role));
}

async function loadEndgamePuzzles() {
  if (egPuzzles) return;
  const rows = await sbFetchAll('puzzles?category=eq.Koncovka&select=id,endgame_type,elo&order=id.asc');
  egPuzzles = new Map();
  const cnt = {};
  (rows || []).forEach(p => {
    const t = p.endgame_type || 'Neklasifikované';
    egPuzzles.set(p.id, { type: t, elo: Number(p.elo || 0) });
    cnt[t] = (cnt[t] || 0) + 1;
  });
  egTypes = Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(e => e[0]);
}

async function loadMap() {
  setStatus('Načítavam...');
  try {
    await loadEndgamePuzzles();
    if (!egTypes.length) { setStatus('V databáze nie sú klasifikované koncovky.', 'error'); return; }

    const filter  = document.getElementById('trenerSelect').value;
    const players = await fetchPlayers(filter);
    if (!players.length) { setStatus('Táto skupina nemá žiadnych hráčov.', 'error'); return; }

    // Len klasický tréning (source='puzzles') — zručnosti sem nepatria.
    // created_at treba na prepočet zvoleného obdobia priamo v prehliadači.
    const ids = players.map(p => p.id).join(',');
    const log = await sbFetchAll(
      `training_log?source=eq.puzzles&player_id=in.(${ids})&select=player_id,puzzle_id,result,created_at`
    );

    mapLog = log || [];
    render(players, mapLog);
    setStatus('');
  } catch (e) {
    setStatus('Chyba pri načítaní: ' + e.message, 'error');
  }
}

// ─── Vykreslenie ─────────────────────────────────────────────────────────────
function render(players, log) {
  const period = periodBounds();

  // stats[playerId][type] = { attempts, solved, eloSum }
  function emptyStats() {
    const s = {};
    players.forEach(p => {
      s[p.id] = {};
      egTypes.forEach(t => { s[p.id][t] = { attempts: 0, solved: 0, eloSum: 0 }; });
    });
    return s;
  }

  const stats    = emptyStats();   // celé obdobie — pokrytie
  const statsPer = emptyStats();   // zvolené obdobie — len na porovnanie ELA

  (log || []).forEach(r => {
    const pz = egPuzzles.get(r.puzzle_id);
    if (!pz || !stats[r.player_id]) return;          // nie je koncovka alebo cudzí hráč
    const s = stats[r.player_id][pz.type];
    if (!s) return;
    s.attempts++;
    if (r.result === 'win') { s.solved++; s.eloSum += pz.elo; }

    if (period) {
      const t = new Date(r.created_at).getTime();
      if (t >= period.from && t <= period.to) {
        const sp = statsPer[r.player_id][pz.type];
        sp.attempts++;
        if (r.result === 'win') { sp.solved++; sp.eloSum += pz.elo; }
      }
    }
  });

  // Hlavička
  let h = '<tr><th class="name-h">Hráč</th>';
  egTypes.forEach(t => { h += `<th title="${t}">${t}</th>`; });
  h += '<th>Spolu</th></tr>';
  document.getElementById('mapHead').innerHTML = h;

  // Riadky — najmenej pokryté hore
  const rows = players.map(p => {
    const tot = egTypes.reduce((a, t) => a + stats[p.id][t].solved, 0);
    const untouched = egTypes.filter(t => stats[p.id][t].attempts === 0).length;
    return { p, tot, untouched };
  }).sort((a, b) => a.tot - b.tot);

  let b = '';
  rows.forEach(({ p, tot }) => {
    const nm = `${p.surname || ''} ${p.name || ''}`.trim() || '(bez mena)';
    b += `<tr><td class="name">${escapeHtml(nm)}</td>`;
    egTypes.forEach(t => { b += cellHtml(stats[p.id][t], statsPer[p.id][t], period); });
    const c = coverColor(tot);
    b += `<td class="cell" style="background:${c.bg};color:${c.fg};border:${c.border};"><div class="n">${tot}</div></td></tr>`;
  });

  // Súhrn skupiny: koľko hráčov daný typ vôbec skúšalo
  b += '<tr class="avg-row"><td class="avg-name">Skúšalo hráčov</td>';
  const tried = {};
  egTypes.forEach(t => {
    tried[t] = players.filter(p => stats[p.id][t].attempts > 0).length;
    const c = coverColor(tried[t] ? 10 : 0);
    b += `<td class="cell" style="background:${c.bg};color:${c.fg};border:${c.border};">
            <div class="n">${tried[t]}/${players.length}</div></td>`;
  });
  b += `<td class="cell" style="border:1px solid #e2e8f0;"></td></tr>`;
  document.getElementById('mapBody').innerHTML = b;

  mapStats   = stats;
  mapPlayers = players;
  initActionPanel();

  document.getElementById('mapTable').style.display = '';
  document.getElementById('mapLegend').style.display = 'flex';

  // Na čo sa zamerať: typy, ktoré skúšalo najmenej hráčov
  const worst = egTypes.map(t => ({ t, n: tried[t] })).sort((a, b2) => a.n - b2.n).slice(0, 3);
  const fl = document.getElementById('focusLine');
  fl.innerHTML = `🎯 <strong>Najmenej pokryté typy:</strong> `
    + worst.map(w => `${w.t} (${w.n} z ${players.length})`).join(', ');
  fl.style.display = 'block';

  // Poctivé upozornenie na obmedzenie dát
  document.getElementById('warnLine').innerHTML =
    `<div class="warn-line">${period
       ? `Prvý riadok bunky je <strong>pokrytie za celé obdobie</strong> (vyriešené/pokusy) a pod ním
          priemerné ELO vyriešených. Tretí riadok je priemerné ELO za <strong>${period.label}</strong>
          a šípka ukazuje rozdiel oproti celku. Pokrytie sa zámerne neoreže — typ zvládnutý dávnejšie
          nie je medzera a nemá zmysel ho zadávať znova.<br>`
       : `Obdobie nie je nastavené — zobrazuje sa len celé obdobie.<br>`}
     Počítajú sa len tréningy, pri ktorých sa dá spoľahlivo určiť pôvod úlohy.
     Časť starších záznamov sa spätne priradiť nedala, takže skutočné počty môžu byť mierne vyššie.
     Od zavedenia označovania sú všetky nové tréningy započítané presne.
     Hviezdička pri priemernom ELO znamená menej než ${THIN_EVIDENCE} vyriešené úlohy — číslo je len orientačné.</div>`;
}

// ─── Zadávanie úloh podľa typu koncovky ─────────────────────────────────────
function initActionPanel() {
  const sel = document.getElementById('thrType');
  const keep = sel.value;
  sel.innerHTML = egTypes.map(t => `<option value="${t}">${t}</option>`).join('');
  if (keep && egTypes.includes(keep)) sel.value = keep;
  sel.onchange = hideBelow;
  document.getElementById('actionCard').style.display = '';
  hideBelow();
}
function hideBelow() {
  const el = document.getElementById('belowResult');
  el.style.display = 'none'; el.innerHTML = '';
}
function setAsgStatus(t, type) {
  const el = document.getElementById('asgStatus');
  if (!el) return;
  el.textContent = t; el.className = 'asg-status ' + type; el.style.display = '';
}

function showBelow() {
  const type = document.getElementById('thrType').value;
  const thr  = Number(document.getElementById('thrValue').value);
  const el   = document.getElementById('belowResult');
  if (!thr || isNaN(thr) || thr < 1) { setStatus('Zadaj platný počet.', 'error'); return; }

  const below = mapPlayers
    .map(p => ({ id: p.id, name: `${p.surname || ''} ${p.name || ''}`.trim() || '(bez mena)',
                 solved: (mapStats[p.id]?.[type]?.solved) || 0 }))
    .filter(x => x.solved < thr)
    .sort((a, b) => a.solved - b.solved);

  if (!below.length) {
    el.innerHTML = `<div class="below-none">✅ V type <strong>${type}</strong> má každý aspoň ${thr} vyriešených koncoviek.</div>`;
    el.style.display = ''; return;
  }

  const d = new Date(); d.setDate(d.getDate() + 14);
  const items = below.map(x => {
    const c = coverColor(x.solved);
    return `<li><label><input type="checkbox" class="pchk" value="${x.id}" checked>
      <span class="val" style="background:${c.bg};color:${c.fg}">${x.solved}</span>${escapeHtml(x.name)}</label></li>`;
  }).join('');

  el.innerHTML = `
    <div class="below-head">${type} — menej než ${thr} vyriešených: ${below.length} z ${mapPlayers.length}</div>
    <div class="below-tools"><a onclick="checkAll(true)">Označiť všetkých</a><a onclick="checkAll(false)">Zrušiť označenie</a></div>
    <ul class="below-list">${items}</ul>
    <div class="assign-box">
      <div class="filter-row">
        <div class="filter-field">
          <label>Cieľ (počet úloh)</label>
          <input type="number" id="asgValue" min="1" max="200" step="1" value="${thr}">
        </div>
        <div class="filter-field">
          <label>Termín</label>
          <input type="date" id="asgDeadline" value="${d.toISOString().substring(0,10)}">
        </div>
        <div class="filter-field">
          <label>Poznámka (nepovinné)</label>
          <input type="text" id="asgNote" placeholder="napr. pozri si aj teóriu">
        </div>
        <button class="primary" onclick="createAssignments()">📌 Zadať úlohu označeným</button>
      </div>
      <div id="asgStatus" class="asg-status" style="display:none;"></div>
    </div>`;
  el.style.display = '';
}

function checkAll(state) {
  document.querySelectorAll('.pchk').forEach(b => { b.checked = state; });
}

async function createAssignments() {
  const boxes = [...document.querySelectorAll('.pchk:checked')];
  if (!boxes.length) { setAsgStatus('Označ aspoň jedného hráča.', 'err'); return; }

  const type  = document.getElementById('thrType').value;
  const value = Number(document.getElementById('asgValue').value);
  const dl    = document.getElementById('asgDeadline').value || null;
  const note  = (document.getElementById('asgNote').value || '').trim() || null;
  if (!value || value < 1 || value > 200) { setAsgStatus('Zadaj počet úloh medzi 1 a 200.', 'err'); return; }

  // Pri koncovkách je cieľ vždy počtový — vlastné ELO pre typy neexistuje.
  const rows = boxes.map(b => ({
    player_id:    Number(b.value),
    trener_id:    USER_ID,
    skill:        null,
    endgame_type: type,
    target_type:  'count',
    target_value: value,
    deadline:     dl,
    note:         note
  }));

  setAsgStatus('Zadávam...', 'ok');
  try {
    await sbFetch('assignments', { method: 'POST', prefer: 'return=minimal', body: JSON.stringify(rows) });
    setAsgStatus(`✅ Zadané ${rows.length} hráčom — ${type}: vyriešiť ${value} koncoviek${dl ? ', termín ' + dl : ''}.`, 'ok');
  } catch (e) {
    setAsgStatus('Chyba pri zadávaní: ' + e.message, 'err');
  }
}

// ─── Inicializácia ───────────────────────────────────────────────────────────
async function init() {
  if (!requireLogin()) return;
  if (IS_HRAC) { alert('Mapa koncoviek je dostupná len pre trénerov a administrátorov.'); goHome(); return; }

  const bn = document.getElementById('roleBanner');
  if (IS_TRENER)             { bn.textContent = `🧑‍🏫 Tréner ${USER_NICK} — moja skupina`; bn.className = 'role-banner trener'; }
  else if (IS_HLAVNY_TRENER) { bn.textContent = `👑 Hlavný tréner ${USER_NICK} — všetci hráči`; bn.className = 'role-banner hlavny_trener'; }
  else if (IS_ADMIN)         { bn.textContent = '🔧 Admin — všetci hráči'; bn.className = 'role-banner admin'; }
  bn.style.display = '';

  document.getElementById('filterCard').style.display = '';

  // Obdobie — predvolene posledné 3 mesiace. Prekreslenie beží nad už načítanými
  // dátami, takže zmena obdobia nevyvolá nový dotaz do databázy.
  applyPreset();
  document.getElementById('periodPreset').addEventListener('change', () => {
    applyPreset();
    if (mapPlayers.length) render(mapPlayers, mapLog);
  });
  ['dateFrom', 'dateTo'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      // Ručná zmena dátumu už nezodpovedá predvoľbe
      document.getElementById('periodPreset').value = 'custom';
      if (mapPlayers.length) render(mapPlayers, mapLog);
    });
  });

  if (IS_ADMIN || IS_HLAVNY_TRENER) {
    const sel = document.getElementById('trenerSelect');
    try {
      const tr = await sbFetch('profiles?role=eq.trener&select=id,name,surname,nick_name&order=surname.asc') || [];
      tr.forEach(t => {
        const o = document.createElement('option');
        o.value = t.id;
        o.textContent = t.nick_name || `${t.surname || ''} ${t.name || ''}`.trim();
        sel.appendChild(o);
      });
    } catch (e) {}
    sel.addEventListener('change', loadMap);
  } else {
    document.getElementById('groupField').style.display = 'none';
  }

  await loadMap();
}

init();
</script>
</body>
</html>
